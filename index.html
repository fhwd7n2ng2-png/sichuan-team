<script>
'use strict';
/* ---------- Brücke zur Wix-Seite ---------- */
const offen = new Map(); let laufNr = 0; let INIT = null;
// Eigenständig = als installierbare App geöffnet (nicht in der Wix-Seite eingebettet).
// SICHUAN_KONFIG setzt werkzeuge/pwa-bauen.mjs: Adresse der Wix-API und der Website.
const ALLEIN = window.parent === window;
const KONFIG = window.SICHUAN_KONFIG || {};
const BASIS = String(KONFIG.website || location.href.replace(/\/_functions\/.*$/, '')).replace(/\/$/, '');
const API_URL = KONFIG.api || 'api';
const speicher = {
  lesen(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } },
  schreiben(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch { /* privat */ } }
};
let SITZUNG = ALLEIN ? speicher.lesen('sichuan.sitzung') : null;
async function rpc(methode, ...args) {
  if (ALLEIN) {
    let r;
    try {
      // text/plain + Token im Body = einfache CORS-Anfrage ohne Preflight
      r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ methode, args, token: SITZUNG ? SITZUNG.token : '' }) });
    } catch { throw new Error('Keine Internetverbindung.'); }
    let d; try { d = await r.json(); } catch { throw new Error('Server antwortet nicht (' + r.status + ').'); }
    if (d.abgemeldet) { abmeldenLokal(); throw new Error(d.fehler || 'Bitte neu anmelden.'); }
    if (!d.ok) throw new Error(d.fehler || 'Unbekannter Fehler.');
    return d.daten;
  }
  return new Promise((ok, nein) => {
    const id = ++laufNr; offen.set(id, { ok, nein });
    window.parent.postMessage({ typ: 'rpc', id, methode, args: JSON.parse(JSON.stringify(args)) }, '*');
    setTimeout(() => { if (offen.has(id)) { offen.delete(id); nein(new Error('Keine Antwort vom Server.')); } }, 60000);
  });
}
window.addEventListener('message', (e) => {
  const d = e.data; if (!d || typeof d !== 'object') return;
  if (d.typ === 'rpc-antwort' && offen.has(d.id)) { const p = offen.get(d.id); offen.delete(d.id); d.ok ? p.ok(d.daten) : p.nein(new Error(d.fehler)); }
  if (d.typ === 'init' && !INIT) { INIT = d; start(); }
});
/** Wix-Seite öffnen: eingebettet über die Seite, als App in einem neuen Fenster. */
function seiteOeffnen(ziel) {
  if (!ALLEIN) { window.parent.postMessage({ typ: 'navigieren', ziel }, '*'); return; }
  const seiten = (SITZUNG && SITZUNG.seiten) || {};
  const pfad = ziel.replace(/^\/reservieren/, seiten.buchung || '/reservieren').replace(/^\/meine-reservierung/, seiten.gast || '/meine-reservierung');
  window.open(BASIS + pfad, '_blank', 'noopener');
}
function urlOeffnen(url) {
  if (!ALLEIN) window.parent.postMessage({ typ: 'oeffnen', url }, '*');
  else window.open(url, '_blank', 'noopener');
}
function abmeldenLokal() { SITZUNG = null; speicher.schreiben('sichuan.sitzung', null); INIT = null; anmeldungZeigen(); }
async function abmelden() { try { await rpc('zugang.abmelden'); } catch { /* egal */ } abmeldenLokal(); }
function anmeldungZeigen(fehler = '') {
  let pin = '';
  $('#wurzel').innerHTML = `<div class="anmeldung"><div class="box">
    <h1>四川 Sichuan</h1><p>Team-App · PIN eingeben</p><p style="margin-top:-12px">${spracheKnopf()}</p>
    <div class="pin-punkte" id="punkte"></div>
    <div class="pin-tasten">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((z) => `<button data-z="${z}">${z}</button>`).join('')}<button data-z="los" style="font-size:16px">OK</button><button data-z="0">0</button><button data-z="weg" style="font-size:20px">⌫</button></div>
    <div class="fehlertext" id="pinfehler">${esc(fehler)}</div></div></div>`;
  const punkte = () => { $('#punkte').innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<i class="${i < pin.length ? 'voll' : ''}"></i>`).join(''); };
  const senden = async () => {
    if (pin.length < 4) return;
    $('#pinfehler').textContent = 'Prüfe …';
    try {
      const r = await rpc('zugang.anmelden', pin);
      SITZUNG = { token: r.token, name: r.name, rolle: r.rolle, seiten: r.seiten };
      speicher.schreiben('sichuan.sitzung', SITZUNG);
      INIT = { modus: 'team' }; start();
    } catch (f) { pin = ''; punkte(); $('#pinfehler').textContent = f.message; }
  };
  const taste = (z) => {
    if (z === 'weg') pin = pin.slice(0, -1);
    else if (z === 'los') return senden();
    else if (pin.length < 8) pin += z;
    punkte(); $('#pinfehler').textContent = '';
    if (pin.length === 8) senden();
  };
  document.querySelectorAll('.pin-tasten button').forEach((b) => { b.onclick = () => taste(b.dataset.z); });
  document.onkeydown = (e) => { if (!$('.anmeldung')) return; if (/^\d$/.test(e.key)) taste(e.key); else if (e.key === 'Backspace') taste('weg'); else if (e.key === 'Enter') taste('los'); };
  punkte();
}
if (ALLEIN) {
  document.body.classList.add('allein');
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  setTimeout(() => { if (SITZUNG) { INIT = { modus: 'team' }; start(); } else anmeldungZeigen(); }, 0);
} else {
  window.parent.postMessage({ typ: 'bereit' }, '*');
  setInterval(() => { if (!INIT) window.parent.postMessage({ typ: 'bereit' }, '*'); }, 1500);
}

/* ---------- Sprache: Deutsch / 中文 ----------
 * Die Oberfläche wird auf Deutsch gebaut; ein Beobachter übersetzt jeden
 * angezeigten Text anhand des Wörterbuchs. Unbekanntes bleibt Deutsch.

  if (n.startsWith('zh')) return 'zh';

function t(s) {
  const w = WOERTER[SPRACHE];
  if (!w || s == null) return s;
  const roh = String(s); const kern = roh.trim(); if (!kern) return roh;
  let neu = w.liste[kern];
  if (neu === undefined) for (const [re, f] of w.muster) { const m = kern.match(re); if (m) { neu = f(m); break; } }
  if (neu === undefined && /\d/.test(kern)) {
    // Einzelwörter in zusammengesetzten Zeilen („18:30 Uhr · 3 Pers.“)
    let x = kern;
    for (const [de, ue] of EINGEBETTET[SPRACHE] || []) x = x.replace(de, ue);
    if (x !== kern) neu = x;
  }
  if (neu === undefined) return roh;
  return roh.replace(kern, neu);
}

const TZ = 'Europe/Vienna';

function melden(text, fehler = false) { const h = $('#hinweis'); h.textContent = text; h.className = fehler ? 'fehler' : ''; clearTimeout(melden.t); melden.t = setTimeout(() => { h.className = 'versteckt'; }, fehler ? 6000 : 2600); }
async function sicher(fn, erfolg) { try { const r = await fn(); if (erfolg) melden(erfolg); return r; } catch (f) { melden(f.message, true); throw f; } }
function zeitAm(tag, min) {
  // Ortszeit Wien → UTC über den Offset dieses Tages
  const probe = new Date(tag + 'T12:00:00Z');

  return new Date(Date.parse(tag + 'T00:00:00Z') + (min - offset) * 60000).toISOString();
}
const STATUS_TEXT = { warteliste: 'Warteliste', angefragt: 'Angefragt', bestaetigt: 'Bestätigt', rueckbestaetigt: 'Rückbestätigt', zeitvorschlag: 'Angebot offen', wartet_drinnen: 'Wartet drinnen', eingetroffen: 'Am Tisch', abgeschlossen: 'Abgeschlossen', abgereist: 'Vorzeitig weg', storniert: 'Storniert', spaet_storniert: 'Spät storniert', noShow: 'No-Show' };

const BALKENFARBE = { angefragt: '#fde68a', bestaetigt: '#bfdbfe', rueckbestaetigt: '#bbf7d0', zeitvorschlag: '#f5d0fe', wartet_drinnen: '#fed7aa', eingetroffen: '#4ade80', abgeschlossen: '#e5e7eb', abgereist: '#e5e7eb' };

/** Sitzdauer und Restzeit eines Gasts am Tisch (nur heute, nur „am Tisch“). */
function sitzInfo(b) {
  if (b.status !== 'eingetroffen' || T.datum !== isoTag(new Date())) return null;

async function laden(still = false) {

function sichtbar() {
  return T.buchungen.filter((b) => {
    if (T.schicht !== 'alle' && b.schicht !== T.schicht) return false;
    const f = T.filter;
    if (f === 'offen' && b.status !== 'angefragt' && b.status !== 'zeitvorschlag') return false;
    if (f === 'kommend' && !['bestaetigt', 'rueckbestaetigt', 'angefragt'].includes(b.status)) return false;
    if (f === 'service' && !['wartet_drinnen', 'eingetroffen'].includes(b.status)) return false;
    if (f === 'warteliste' && b.status !== 'warteliste') return false;
    if (f === 'noshow' && b.status !== 'noShow' && !b.ueberfaellig) return false;
    if (f === 'storno' && !['storniert', 'spaet_storniert'].includes(b.status)) return false;
    if (f === 'alle' && ['storniert', 'spaet_storniert'].includes(b.status)) return false;

  });
}

function timelineZeichnen() {
  const tl = T.timeline; if (!tl) return;
  const von = T.schicht === 'abend' ? 17 * 60 : 11 * 60, bis = T.schicht === 'mittag' ? 15 * 60 : 23 * 60 + 30;
  const pxMin = 2.2, breite = (bis - von) * pxMin + 70, x = (m) => 64 + (m - von) * pxMin;
  const filter = new Set(sichtbar().map((b) => b._id));
  let html = `<div class="tl" style="max-height:calc(100vh - 150px)"><div style="width:${breite}px;position:relative"><div class="tl-kopf">`;
  for (let h = Math.ceil(von / 60); h * 60 <= bis; h++) html += `<span class="tl-std" style="left:${x(h * 60) - 12}px">${h}:00</span>`;
  html += `</div>`;
  // Ankünfte je Viertelstunde (Personen), wie „Incoming“ bei Zenchef
  const ank = {};
  for (const b of sichtbar()) {
    if (INAKTIV.includes(b.status)) continue;
    const m = Math.floor(minuten(b.datumZeit) / 15) * 15;
    ank[m] = (ank[m] || 0) + (b.personen || 0);
  }
  html += `<div class="tl-ank"><div class="tl-name klein" style="font-weight:600">Ankünfte</div>${Object.entries(ank).filter(([m]) => +m >= von && +m <= bis).map(([m, p]) => `<span class="tl-ankz" style="left:${x(+m)}px;width:${15 * pxMin - 2}px" title="${p} Pers. ab ${hhmm(+m)}">${p}</span>`).join('')}</div>`;
  let gruppe = '';
  for (const z of tl.zeilen) {
    if (z.bereich !== gruppe) { gruppe = z.bereich; html += `<div class="tl-gruppe">${esc(bereichName(gruppe))}</div>`; }
    html += `<div class="tl-zeile" data-tisch="${esc(z.tisch)}"><div class="tl-name">${esc(z.tisch)}<span class="leise" style="font-weight:400;margin-left:3px">${z.maxPersonen ? '·' + z.maxPersonen : ''}</span></div>`;
    for (const b of z.balken) {
      if (b.endeMin < von || b.startMin > bis || !filter.has(b.id)) continue;
      const l = x(Math.max(b.startMin, von)), w = Math.max(18, (Math.min(b.endeMin, bis) - Math.max(b.startMin, von)) * pxMin - 2);
      const bu = T.buchungen.find((y) => y._id === b.id); const si = bu ? sitzInfo(bu) : null;
      html += `<div class="tl-balken ${b.konflikt ? 'konflikt' : ''} ${si?.ueber ? 'ueber' : si?.bald ? 'bald' : ''}" data-id="${b.id}" style="left:${l}px;width:${w}px;background:${BALKENFARBE[b.status] || '#e5e7eb'}" title="${esc(b.name)} · ${b.personen} P.">${b.gesperrt ? '🔒' : ''}<b>${b.personen}</b> ${esc(b.name)}${b.risiko >= 50 ? ' ⚠' : ''}${si && si.seit !== null ? ` · ⏱${si.seit}′` : ''}</div>`;
    }
    html += `</div>`;
  }
  const jetzt = minuten(new Date());
  if (T.datum === isoTag(new Date()) && jetzt >= von && jetzt <= bis) html += `<div class="tl-jetzt" style="left:${x(jetzt)}px"></div>`;
  html += `</div></div>`;
  if (tl.ohneTisch.length) html += `<div class="karte" style="margin-top:10px"><b>Ohne Tisch:</b> ${tl.ohneTisch.map((b) => `<span class="chip" data-id="${b.id}">${b.personen} P. ${esc(b.name)}</span>`).join(' ')}</div>`;
  $('#inhalt').innerHTML = html;
  document.querySelectorAll('#inhalt [data-id]:not(.tl-balken)').forEach((e) => { e.onclick = () => detailZeigen(e.dataset.id); });
  timelineZiehen(pxMin);
  // Beim ersten Zeichnen zur aktuellen Zeit (heute) bzw. zur ersten Buchung scrollen,
  // danach die Scrollposition des Teams behalten.
  const box = $('#inhalt .tl');
  if (box) {
    const schluessel = T.datum + T.schicht;
    if (T.tlScroll && T.tlScroll.k === schluessel) box.scrollLeft = T.tlScroll.x;
    else {
      const ersteB = sichtbar().filter((b) => !INAKTIV.includes(b.status)).map((b) => minuten(b.datumZeit)).sort((a, c) => a - c)[0];
      const ziel = T.datum === isoTag(new Date()) && jetzt >= von && jetzt <= bis ? jetzt - 60 : ersteB ?? von;
      box.scrollLeft = Math.max(0, x(ziel) - 70);
    }
    box.onscroll = () => { T.tlScroll = { k: schluessel, x: box.scrollLeft }; };
  }
}

function hhmm(m) { return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; }

/**
 * Balken ziehen: waagrecht = neue Uhrzeit (15-Min.-Raster), senkrecht = anderer
 * Tisch, rechter Rand = Dauer. Ein Tipp ohne Bewegung öffnet die Details.
 */
function timelineZiehen(pxMin) {
  const zeilen = [...document.querySelectorAll('#inhalt .tl-zeile')];
  document.querySelectorAll('#inhalt .tl-balken').forEach((el) => {
    el.addEventListener('pointerdown', (ev) => {
      if (ev.button !== undefined && ev.button !== 0) return;
      const b = T.buchungen.find((y) => y._id === el.dataset.id);
      if (!b) return;
      const rand = el.getBoundingClientRect().right - ev.clientX < 10;
      const x0 = ev.clientX, y0 = ev.clientY;
      const left0 = parseFloat(el.style.left), w0 = parseFloat(el.style.width);
      const zeile0 = el.closest('.tl-zeile'), vonTisch = zeile0.dataset.tisch;
      const start0 = minuten(b.datumZeit), dauer0 = b.dauerMinuten || 90;
      let bewegt = false, dMin = 0, ziel = zeile0, info = null;
      try { el.setPointerCapture(ev.pointerId); } catch (_) { /* egal */ }
      const zeigen = (e, text) => {
        if (!info) { info = document.createElement('div'); info.className = 'tl-info'; document.body.appendChild(info); }
        info.textContent = text; info.style.left = (e.clientX + 12) + 'px'; info.style.top = (e.clientY - 28) + 'px';
      };
      const move = (e) => {
        const dx = e.clientX - x0, dy = e.clientY - y0;
        if (!bewegt && Math.hypot(dx, dy) < 6) return;
        if (!bewegt) { bewegt = true; ZIEHT = true; el.classList.add('zieht'); }
        e.preventDefault();
        dMin = Math.round(dx / pxMin / 15) * 15;
        if (rand) {
          dMin = Math.max(15 - dauer0, dMin);
          el.style.width = Math.max(15 * pxMin, w0 + dMin * pxMin) + 'px';
          zeigen(e, `${hhmm(start0)}–${hhmm(start0 + dauer0 + dMin)} · ${dauer0 + dMin} Min.`);
        } else {
          el.style.left = (left0 + dMin * pxMin) + 'px';
          const z = zeilen.find((r) => { const q = r.getBoundingClientRect(); return e.clientY >= q.top && e.clientY < q.bottom; });
          if (z && z !== ziel) { ziel.classList.remove('ziel'); ziel = z; if (z !== zeile0) z.classList.add('ziel'); z.appendChild(el); }
          zeigen(e, `${hhmm(start0 + dMin)} · Tisch ${ziel.dataset.tisch}`);
        }
      };
      const ende = async () => {
        el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', ende); el.removeEventListener('pointercancel', ende);
        info?.remove(); ziel.classList.remove('ziel');
        if (!bewegt) { detailZeigen(b._id); return; }
        const aend = { tische: (b.tische || []).map(String) };
        if (rand) {
          if (dMin) aend.dauerMinuten = dauer0 + dMin;
        } else {
          if (dMin) aend.zeit = new Date(new Date(b.datumZeit).getTime() + dMin * 60000).toISOString();
          const nach = ziel.dataset.tisch;
          if (nach && nach !== vonTisch) aend.tische = aend.tische.includes(nach) ? aend.tische : aend.tische.map((t) => (t.toUpperCase() === String(vonTisch).toUpperCase() ? nach : t));
        }
        const geaendert = aend.zeit || aend.dauerMinuten || aend.tische.join() !== (b.tische || []).map(String).join();
        if (!geaendert) { ZIEHT = false; timelineZeichnen(); return; }
        try { await sicher(() => rpc('reservierungen.umbuchen', b._id, aend), 'Umgebucht'); } catch (_) { /* Meldung kam schon */ }
        ZIEHT = false; T.verlauf = []; laden();
      };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', ende); el.addEventListener('pointercancel', ende);
    });
  });
}

/* ---------------------------------------------------------------------
   TISCHPLAN – ganzer Service auf einen Blick, Drag & Drop, Popover, Editor
   --------------------------------------------------------------------- */
const AM_TISCH = ['eingetroffen', 'wartet_drinnen'];
const KANAL_TEXT = { online: 'Website', telefon: 'Telefon', walkin: 'Walk-in', google: 'Google', warteliste: 'Warteliste', email: 'E-Mail', import: 'Import' };
const DEKO = { 'deko-wand': 'Wand', 'deko-bar': 'Bar / Theke', 'deko-pflanze': 'Pflanze', 'deko-text': 'Beschriftung', 'deko-tuer': 'Tür / Durchgang' };
const nrGleich = (a, c) => String(a).toUpperCase() === String(c).toUpperCase();
const istDeko = (t) => (t.art || 'tisch') !== 'tisch';
const BEREICH_NAMEN = { innen: 'Innen', terrasse: 'Terrasse', vordergarten: 'Vordergarten', hintergarten: 'Hintergarten', nebenraum: 'Nebenraum', separee: 'Separee' };
const bereichName = (b) => BEREICH_NAMEN[b] || b;

/** Reservierungen des angezeigten Service (ohne Stornos und abgeschlossene). */
function planReservierungen() {
  const heute = T.datum === isoTag(new Date());
  const jetztMin = minuten(new Date());
  const svc = T.schicht !== 'alle' ? T.schicht : heute ? (jetztMin < 16 * 60 ? 'mittag' : 'abend') : null;
  const schichtVon = (b) => b.schicht || (minuten(b.datumZeit) < 16 * 60 ? 'mittag' : 'abend');
  const liste = sichtbar().filter((b) => !INAKTIV.includes(b.status) && !['abgeschlossen', 'abgereist'].includes(b.status) &&
    (T.planModus === 'zeit' || !svc || schichtVon(b) === svc || AM_TISCH.includes(b.status)))
    .sort((a, c) => new Date(a.datumZeit) - new Date(c.datumZeit));
  return { liste, svc, heute, jetztMin };
}

function planZeichnen() {
  if (T.planZeit === null) T.planZeit = T.datum === isoTag(new Date()) ? Math.max(11 * 60 + 30, Math.min(Math.floor(minuten(new Date()) / 15) * 15, 22 * 60)) : 19 * 60;
  if (!T.planModus) T.planModus = 'service';
  const quelleTische = T.planEdit ? T.planEntwurf : T.tische;
  const bereiche = [...new Set(quelleTische.map((t) => t.bereich || 'innen').concat(T.planEdit ? T.planNeueBereiche || [] : []))];
  if (!T.planBereich || !bereiche.includes(T.planBereich)) T.planBereich = bereiche.includes('innen') ? 'innen' : bereiche[0] || 'innen';
  const elemente = quelleTische.filter((t) => (t.bereich || 'innen') === T.planBereich);
  const { liste: imService, svc, heute, jetztMin } = planReservierungen();
  const proTisch = (nr) => imService.filter((b) => (b.tische || []).some((x) => nrGleich(x, nr)));
  const zumZeitpunkt = (l) => l.find((b) => AM_TISCH.includes(b.status) && minuten(b.datumZeit) <= T.planZeit + 30) ||
    l.find((b) => minuten(b.datumZeit) <= T.planZeit + 30 && minuten(b.datumZeit) + (b.dauerMinuten || 90) > T.planZeit);
  const tischeHier = elemente.filter((t) => !istDeko(t));
  const vergeben = new Set(imService.flatMap((b) => (b.tische || []).map((x) => String(x).toUpperCase())));
  const belegtZahl = tischeHier.filter((t) => vergeben.has(String(t.nummer).toUpperCase())).length;

  // Grundgerüst: Liste links, Bühne rechts – zusammen genau so hoch wie der freie Bildschirm.
  const oben = $('#inhalt').getBoundingClientRect().top;
  const hoehe = Math.max(320, window.innerHeight - oben - 12);
  const schmal = window.innerWidth < 760;
  $('#inhalt').innerHTML = `<div class="planwrap ${schmal ? 'schmal' : ''}" style="height:${schmal ? 'auto' : hoehe + 'px'}">
    <div class="planseite" id="planSeite"></div>
    <div class="planbuehne-box"><div class="planleiste" id="planLeiste"></div><div class="planbuehne" id="planBuehne" style="${schmal ? 'height:' + Math.max(360, Math.round(window.innerHeight * 0.62)) + 'px' : ''}"></div></div></div>`;

  const aenderungen = (T.planGeaendert?.size || 0) + (T.planLoeschen?.length || 0);
  $('#planLeiste').innerHTML = `${bereiche.map((b) => `<span class="chip ${b === T.planBereich ? 'an' : ''}" data-bereich="${esc(b)}">${esc(bereichName(b))}</span>`).join('')}
    ${T.planEdit ? `<span class="chip" id="peBereichNeu">+ Bereich</span>` : `<span class="trenner"></span>
    <span class="chip ${T.planModus === 'service' ? 'an' : ''}" data-modus="service">Ganzer Service</span><span class="chip ${T.planModus === 'zeit' ? 'an' : ''}" data-modus="zeit">Zeitpunkt</span>
    ${T.planModus === 'zeit' ? `<span class="fett">${hhmm(T.planZeit)}</span><input type="range" id="planRegler" min="${11 * 60}" max="${23 * 60}" step="15" value="${T.planZeit}" style="width:160px">` : `<span class="klein"><b>${svc === 'mittag' ? 'Mittag' : svc === 'abend' ? 'Abend' : 'Ganzer Tag'}</b> · <span class="leise">${belegtZahl} von ${tischeHier.length} Tischen reserviert</span></span>`}`}
    <span style="flex:1"></span>
    ${T.planEdit ? `<button class="klein" id="peTisch">+ Tisch</button><select id="peDeko" class="klein"><option value="">+ Deko …</option>${Object.entries(DEKO).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select>
      <label class="klein zeile" style="gap:4px;margin:0"><input type="checkbox" id="peRaster" ${T.planRaster !== false ? 'checked' : ''}> Raster</label>
      <button class="klein" id="peUndo" ${T.planUndo?.length ? '' : 'disabled'} title="Rückgängig">↶</button>
      <button class="klein" id="peVerwerfen">Verwerfen</button><button class="klein primaer" id="peSpeichern">Speichern${aenderungen ? ` (${aenderungen})` : ''}</button>`
    : `<button class="klein" id="peGarten" title="Wetter und automatische Umschichtung in die Gärten">☀ Garten</button><button class="klein" id="peStart" title="Tische verschieben, Grösse ändern, neue Tische und Deko anlegen">✎ Plan bearbeiten</button>`}`;

  // Bühne: alle Elemente des Bereichs einpassen – auf einen Blick, egal wie gross der Bildschirm ist.
  const buehne = $('#planBuehne');
  const B_W = buehne.clientWidth, B_H = buehne.clientHeight;
  const pad = 14;
  const xs = elemente.map((t) => t.positionX || 0), ys = elemente.map((t) => t.positionY || 0);
  const xe = elemente.map((t) => (t.positionX || 0) + (t.planBreite || 100)), ye = elemente.map((t) => (t.positionY || 0) + (t.planHoehe || 80));
  let minX = elemente.length ? Math.min(...xs) : 0, minY = elemente.length ? Math.min(...ys) : 0;
  let maxX = elemente.length ? Math.max(...xe) : 800, maxY = elemente.length ? Math.max(...ye) : 600;
  if (T.planEdit) { const rx = (maxX - minX) * 0.1 + 40, ry = (maxY - minY) * 0.1 + 40; minX = Math.max(0, minX - rx); minY = Math.max(0, minY - ry); maxX += rx; maxY += ry; }
  const f = Math.max(0.05, Math.min((B_W - 2 * pad) / Math.max(1, maxX - minX), (B_H - 2 * pad) / Math.max(1, maxY - minY), 2.2));
  const ox = pad + Math.max(0, ((B_W - 2 * pad) - (maxX - minX) * f) / 2), oy = pad;
  T.planGeo = { f, minX, minY, ox, oy };
  const fs = Math.max(8, Math.min(14, 11 * Math.sqrt(f)));
  let html = '';
  for (const t of elemente) {
    const st = `left:${ox + ((t.positionX || 0) - minX) * f}px;top:${oy + ((t.positionY || 0) - minY) * f}px;width:${(t.planBreite || 100) * f}px;height:${(t.planHoehe || 80) * f}px;transform:rotate(${t.planDrehung || 0}deg);font-size:${fs}px`;
    const gewaehlt = T.planEdit && T.planAuswahl === t._id ? 'gewaehlt' : '';
    if (istDeko(t)) {
      html += `<div class="deko ${esc(t.art)} ${gewaehlt}" data-el="${esc(t._id)}" style="${st}">${t.art === 'deko-pflanze' ? '🌿' : ''}<span>${esc(t.label || (t.art === 'deko-bar' ? 'Bar' : ''))}</span>${T.planEdit ? '<i class="griff"></i>' : ''}</div>`;
      continue;
    }
    if (T.planEdit) {
      html += `<div class="tisch edit ${t.form === 'rund' ? 'rund' : ''} ${t.aktiv === false ? 'inaktiv' : ''} ${gewaehlt}" data-el="${esc(t._id)}" style="${st}"><span class="nr">${esc(t.nummer)}</span><span class="leise">${t.minPersonen || '?'}–${t.maxPersonen || '?'}${t.nurManuell ? ' ✋' : ''}</span><i class="griff"></i></div>`;
      continue;
    }
    const l = proTisch(t.nummer);
    const anzeigen = T.planModus === 'zeit' ? [zumZeitpunkt(l)].filter(Boolean) : l;
    const sitzt = anzeigen.find((b) => AM_TISCH.includes(b.status));
    const naechste = anzeigen.find((b) => !AM_TISCH.includes(b.status));
    const bezug = T.planModus === 'zeit' ? T.planZeit : (heute ? jetztMin : -1);
    const bald = naechste && bezug >= 0 && minuten(naechste.datumZeit) - bezug <= 30 && minuten(naechste.datumZeit) + (naechste.dauerMinuten || 90) > bezug;
    const klasse = t.aktiv === false ? 'inaktiv' : sitzt ? 'da' : bald ? 'bald' : anzeigen.length ? 'belegt' : '';
    const si = sitzt ? sitzInfo(sitzt) : null;
    const h = (t.planHoehe || 80) * f;
    const platz = Math.max(1, Math.floor((h - fs * 1.6) / (fs * 1.25)));
    const zeilen = anzeigen.slice(0, anzeigen.length > platz ? platz - 1 : platz);
    const rest = anzeigen.length - zeilen.length;
    const titel = anzeigen.map((b) => `${uhr(b.datumZeit)} · ${b.personen} P. · ${gastName(b)} · ${STATUS_TEXT[b.status] || b.status}`).join('\n');
    const erste = sitzt || naechste;
    html += `<div class="tisch ${t.form === 'rund' ? 'rund' : ''} ${klasse} ${si && (si.bald || si.ueber) ? 'endet' : ''}" data-tisch="${esc(t.nummer)}" ${erste ? `data-id="${erste._id}"` : ''} title="${esc(titel)}" style="${st}">
      <span class="nr">${esc(t.nummer)} <span class="leise" style="font-weight:400;font-size:.85em">${t.minPersonen ? t.minPersonen + '–' + t.maxPersonen : ''}${t.nurManuell ? ' ✋' : ''}</span></span>
      ${zeilen.map((b) => `<span class="res ${AM_TISCH.includes(b.status) ? 'sitzt' : ''} ${b.risiko?.punkte >= 50 ? 'risiko' : ''}" data-res="${b._id}" data-von="${esc(t.nummer)}">${uhr(b.datumZeit)} <b>${b.personen}</b> ${esc(gastName(b).split(' ').slice(-1)[0] || '')}${AM_TISCH.includes(b.status) && si ? ` ⏱${si.seit ?? '–'}′` : ''}${(b.tische || []).length > 1 ? ' ⧉' : ''}${b.gastId?.allergien ? ' ⚠️' : ''}</span>`).join('')}
      ${rest > 0 ? `<span class="res mehr">+${rest} weitere</span>` : ''}</div>`;
  }
  buehne.innerHTML = html || `<div class="leise" style="padding:20px">Keine Tische in diesem Bereich.${T.planEdit ? ' Oben „+ Tisch“.' : ''}</div>`;

  if (T.planEdit) planEditorFormular(); else planListeZeichnen(imService, svc);

  document.querySelectorAll('#planLeiste [data-bereich]').forEach((c) => { c.onclick = () => { T.planBereich = c.dataset.bereich; T.planAuswahl = null; planZeichnen(); }; });
  document.querySelectorAll('#planLeiste [data-modus]').forEach((c) => { c.onclick = () => { T.planModus = c.dataset.modus; planZeichnen(); }; });
  if ($('#planRegler')) $('#planRegler').oninput = (e) => { T.planZeit = +e.target.value; planZeichnen(); };
  if ($('#peStart')) $('#peStart').onclick = planEditStarten;
  if ($('#peGarten')) $('#peGarten').onclick = gartenDialog;
  if (T.planEdit) planEditorEreignisse(); else planDragEreignisse();
}

/** Linke Spalte: alle Reservierungen des Service – ziehbar auf einen Tisch. */
function planListeZeichnen(liste, svc) {
  const ohne = liste.filter((b) => !(b.tische || []).length);
  const zeile = (b) => `<div class="planzeile ${AM_TISCH.includes(b.status) ? 'sitzt' : ''} ${(b.tische || []).length ? '' : 'ohne'}" data-res="${b._id}">
    <span class="fett">${uhr(b.datumZeit)}</span><span class="pz-name">${esc(gastName(b))}${b.gastId?.allergien ? ' ⚠️' : ''}${b.gastWunsch ? ' 💬' : ''}</span>
    <span class="badge">${b.personen}</span><span class="pz-tisch">${esc((b.tische || []).join('+') || '–')}</span></div>`;
  $('#planSeite').innerHTML = `<div class="klein leise" style="margin-bottom:6px">${svc === 'mittag' ? 'Mittag' : svc === 'abend' ? 'Abend' : 'Reservierungen'} · ${liste.length} · auf einen Tisch ziehen</div>
    ${ohne.length ? `<div class="klein fett" style="color:var(--rot);margin:4px 0">Ohne Tisch (${ohne.length})</div>${ohne.map(zeile).join('')}<div class="klein fett" style="margin:8px 0 4px">Mit Tisch</div>` : ''}
    ${liste.filter((b) => (b.tische || []).length).map(zeile).join('') || (ohne.length ? '' : '<div class="leise klein">Keine Reservierungen.</div>')}`;
}

/** Drag & Drop: Reservierung von Tisch zu Tisch oder aus der Liste auf einen Tisch. */
function planDragEreignisse() {
  document.querySelectorAll('#planBuehne .res[data-res], #planSeite .planzeile[data-res]').forEach((el) => {
    el.addEventListener('pointerdown', (ev) => {
      if (ev.button !== undefined && ev.button !== 0) return;
      ev.stopPropagation();
      const b = T.buchungen.find((y) => y._id === el.dataset.res); if (!b) return;
      const vonTisch = el.dataset.von || null;
      const x0 = ev.clientX, y0 = ev.clientY; let geist = null, ziel = null;
      try { el.setPointerCapture(ev.pointerId); } catch (_) { /* egal */ }
      const move = (e) => {
        if (!geist && Math.hypot(e.clientX - x0, e.clientY - y0) < 6) return;
        e.preventDefault();
        if (!geist) { ZIEHT = true; geist = document.createElement('div'); geist.className = 'zieh-geist'; geist.textContent = `${uhr(b.datumZeit)} · ${b.personen} P. · ${gastName(b)}`; document.body.appendChild(geist); }
        geist.style.left = e.clientX + 12 + 'px'; geist.style.top = e.clientY + 12 + 'px';
        const unter = document.elementsFromPoint(e.clientX, e.clientY).find((x) => x.matches && x.matches('#planBuehne .tisch[data-tisch]'));
        if (ziel && ziel !== unter) ziel.classList.remove('drop-ziel');
        ziel = unter || null; if (ziel) ziel.classList.add('drop-ziel');
      };
      const ende = async () => {
        el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', ende); el.removeEventListener('pointercancel', ende);
        if (!geist) { crmPopover(b, el); return; }
        geist.remove(); ziel?.classList.remove('drop-ziel'); ZIEHT = false;
        if (ziel) await tischZuweisen(b, ziel.dataset.tisch, vonTisch);
      };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', ende); el.addEventListener('pointercancel', ende);
    });
  });
  document.querySelectorAll('#planBuehne .tisch[data-tisch]').forEach((e) => {
    e.onclick = (ev) => {
      if (ev.target.closest('.res[data-res]')) return;
      const b = e.dataset.id && T.buchungen.find((y) => y._id === e.dataset.id);
      if (b) crmPopover(b, e); else freierTischPopover(e.dataset.tisch, e);
    };
  });
}

/** Weist eine Reservierung einem Tisch zu – ersetzen oder (bei zu kleinem Tisch) dazunehmen. */
async function tischZuweisen(b, ziel, vonTisch) {
  const aktuell = (b.tische || []).map(String);
  if (aktuell.some((x) => nrGleich(x, ziel))) return;
  const tischInfo = (nr) => T.tische.find((t) => nrGleich(t.nummer, nr)) || {};
  const ersetzt = vonTisch ? aktuell.map((x) => (nrGleich(x, vonTisch) ? ziel : x)) : [ziel];
  const plaetze = (liste) => liste.reduce((s, nr) => s + (tischInfo(nr).maxPersonen || 0), 0);
  let neu = ersetzt;
  if (plaetze(ersetzt) < b.personen) {
    const opt = aktuell.length ? [['dazu', `Dazunehmen → ${[...aktuell, ziel].join('+')}`], ['ersetzen', `Trotzdem nur ${ersetzt.join('+')}`]] : [['ersetzen', `Trotzdem Tisch ${ziel}`]];

  T.verlauf = []; laden(true);
}

function popoverSchliessen() { document.querySelectorAll('.popover').forEach((p) => p.remove()); }
function popoverZeigen(html, anker) {
  popoverSchliessen();
  const p = document.createElement('div'); p.className = 'popover'; p.innerHTML = html;
  document.body.appendChild(p);
  const r = anker.getBoundingClientRect();
  if (window.innerWidth < 600) p.style.width = (window.innerWidth - 16) + 'px';
  const w = p.offsetWidth, h = p.offsetHeight;
  let x = r.right + 8, y = r.top;
  if (x + w > window.innerWidth - 8) x = r.left - w - 8;
  if (x < 8) x = Math.max(8, Math.min(window.innerWidth - w - 8, r.left));
  if (y + h > window.innerHeight - 8) y = Math.max(8, window.innerHeight - h - 8);
  p.style.left = x + 'px'; p.style.top = y + 'px';
  setTimeout(() => {
    const zu = (e) => { if (!p.contains(e.target)) { p.remove(); document.removeEventListener('pointerdown', zu, true); } };

  }, 0);
  p.querySelector('.pop-zu')?.addEventListener('click', () => p.remove());

}

function planElementNeu(art, vorlage = null) {
  planMerken();
  const g = T.planGeo || { f: 1, minX: 0, minY: 0, ox: 0, oy: 0 };
  const buehne = $('#planBuehne');
  const mitteX = g.minX + (buehne.clientWidth / 2 - g.ox) / g.f, mitteY = g.minY + (buehne.clientHeight / 2 - g.oy) / g.f;
  const hoechste = Math.max(0, ...T.planEntwurf.filter((x) => !istDeko(x)).map((x) => parseInt(x.nummer, 10) || 0));
  const neu = vorlage ? JSON.parse(JSON.stringify(vorlage)) : { art, bereich: T.planBereich, form: 'rechteck', planBreite: art === 'deko-wand' ? 300 : art === 'deko-pflanze' ? 50 : art === 'deko-tuer' ? 90 : 140, planHoehe: art === 'deko-wand' ? 12 : art === 'deko-pflanze' ? 50 : art === 'deko-tuer' ? 20 : 80, planDrehung: 0, aktiv: art === 'tisch', minPersonen: 2, maxPersonen: 4, prioritaet: 50, kombinierbarMit: [], label: art === 'deko-bar' ? 'Bar' : art === 'deko-text' ? 'Text' : '' };
  delete neu._owner; delete neu._createdDate; delete neu._updatedDate;
  neu._id = 'neu-' + Math.random().toString(36).slice(2, 8);
  neu.positionX = runden(vorlage ? (vorlage.positionX || 0) + 30 : mitteX - (neu.planBreite || 100) / 2);
  neu.positionY = runden(vorlage ? (vorlage.positionY || 0) + 30 : mitteY - (neu.planHoehe || 80) / 2);
  if (!istDeko(neu)) neu.nummer = String(hoechste + 1);
  T.planEntwurf.push(neu); T.planGeaendert.add(neu._id); T.planAuswahl = neu._id; planZeichnen();
}
function planElementLoeschen(id) {
  planMerken();
  T.planEntwurf = T.planEntwurf.filter((x) => x._id !== id); T.planGeaendert.delete(id);
  if (!String(id).startsWith('neu-')) T.planLoeschen.push(id);
  T.planAuswahl = null; planZeichnen();
}
async function planSpeichern() {
  const geaendert = T.planEntwurf.filter((t) => T.planGeaendert.has(t._id)).map((t) => {
    const { _owner, _createdDate, _updatedDate, ...rest } = t;
    if (String(rest._id).startsWith('neu-')) delete rest._id;
    return rest;
  });
  try {
    if (geaendert.length) await rpc('verwaltung.tischeSpeichern', geaendert);
    for (const id of T.planLoeschen) await rpc('verwaltung.tischEntfernen', id);
    melden('Tischplan gespeichert');
    T.tische = await rpc('team.tischeLaden'); planEditBeenden(); laden(true);
  } catch (f) { melden(f.message, true); }
}

  $('#peRaster').onchange = (e) => { T.planRaster = e.target.checked; };

      if (ev.button !== undefined && ev.button !== 0) return;
      ev.preventDefault(); ev.stopPropagation();
      const t = T.planEntwurf.find((x) => x._id === el.dataset.el); if (!t) return;
      const groesse = ev.target.classList.contains('griff');

      let bewegt = false;

      const move = (e) => {

        if (!bewegt) { bewegt = true; planMerken(); ZIEHT = true; }
        const dx = (e.clientX - x0) / g.f, dy = (e.clientY - y0) / g.f;

    });

}

  const neu = T.gewaehlt !== id; T.gewaehlt = id; document.querySelector('.haupt')?.classList.remove('ohne-seite');
  if (!stillesNeuladen && T.ansicht === 'liste') listeZeichnen();
  if (neu) T.verlauf = [];
  const g = b.gastId && typeof b.gastId === 'object' ? b.gastId : {};
  const aktionen = (b.naechsteStatus || []).filter((s) => s !== 'zeitvorschlag' && s !== 'warteliste');
  $('#seite').innerHTML = `
    <div class="zeile" style="justify-content:space-between"><button class="klein" id="schliessen">← Übersicht</button>${badge(b.status)}</div>
    <h3 style="margin:10px 0 0">${esc(gastName(b))}</h3>

      <span class="klein">${g.anzahlBesuche || 0} Besuche · ${g.anzahlNoShows || 0} No-Shows · ${g.anzahlSpaeteStornos || 0} spät storniert</span></div>
    ${b.risiko ? `<div class="karte" style="padding:8px 10px"><span class="badge r-${b.risiko.stufe}">No-Show-Risiko ${b.risiko.punkte}</span> <span class="klein leise">${esc(b.risiko.gruende.join(' · ') || 'unauffällig')}</span></div>` : ''}
    ${g.allergien ? `<p>⚠️ <b>Allergie:</b> ${esc(g.allergien)}</p>` : ''}${g.praeferenzen ? `<p class="klein">★ ${esc(g.praeferenzen)}</p>` : ''}
    <div class="karte" style="margin:10px 0">
      <div class="fett" style="font-size:16px">${datumText(b.datumZeit)} · ${uhr(b.datumZeit)} · ${b.personen} Pers.</div>
      <div>Tisch <b>${esc((b.tische || []).join(' + ') || '–')}</b>${b.bereich ? ' · ' + esc(b.bereich) : ''} · ${b.dauerMinuten || 90} min · Quelle ${esc(b.quelle || '')}</div>
      ${b.status === 'zeitvorschlag' && b.angebotBis ? `<div class="klein">Angebot gültig bis ${uhr(b.angebotBis)} Uhr${b.angebotArt === 'warteliste' ? ' (aus Warteliste)' : ''}</div>` : ''}

    <label>Status</label>
    <div class="zeile">${aktionen.map((s) => `<button class="klein ${s === 'eingetroffen' || s === 'bestaetigt' ? 'primaer' : ''}" data-status="${s}">${esc(AKTION_TEXT[s] || STATUS_TEXT[s] || s)}</button>`).join('') || '<span class="leise klein">keine</span>'}</div>
    <label>Umbuchen (Zeit · Personen · Tische)</label>

    <label>Tags (Komma)</label><input id="dTags" value="${esc((b.tags || []).join(', '))}" placeholder="geburtstag, vip, geschaeftsessen">
    <label>Vermittler</label><input id="dVerm" value="${esc(b.vermittler || '')}" placeholder="Hotel, Concierge, Firma">

    const n = +prompt('Wie viele Termine insgesamt (wöchentlich, gleiche Uhrzeit)?', '4'); if (!n) return;
    const r = await sicher(() => rpc('reservierungen.serieAnlegen', { zeit: new Date(b.datumZeit).toISOString(), personen: b.personen, telefon: g.telefonE164, vorname: g.vorname, nachname: g.nachname, email: g.email, anzahl: n, quelle: 'telefon', tags: b.tags || [] }));
    melden(`${r.angelegt.length} Termine angelegt${r.fehlgeschlagen.length ? ', ' + r.fehlgeschlagen.length + ' ohne freien Tisch' : ''}`);
  };
  $('#dSpeichern').onclick = async () => { await sicher(() => rpc('reservierungen.detailsSetzen', id, { tags: $('#dTags').value.split(',').map((s) => s.trim()).filter(Boolean), vermittler: $('#dVerm').value, notiz: $('#dNotiz').value }), 'Gespeichert'); T.verlauf = []; laden(); };
  $('#gastlink').onclick = async () => { const link = await sicher(() => rpc('team.gastlinkFuerTest', id)); urlOeffnen(link); };
  zahlungDetailEreignisse(b);
  if ($('#fblink')) $('#fblink').onclick = async () => { const r = await sicher(() => rpc('feedback.jetztAnfragen', id)); urlOeffnen(r.link); };
  if (!T.verlauf.length) {
    try { T.verlauf = await rpc('reservierungen.verlauf', id); if (T.gewaehlt === id && $('#verlauf')) $('#verlauf').innerHTML = verlaufHtml(); } catch (f) { /* still */ }
  }
}

async function neueReservierung(vorgabe = {}) {
  const istWarte = Boolean(vorgabe.warteliste);
  const m = modal(`<h3 style="margin-top:0">${istWarte ? 'Auf die Warteliste' : 'Neue Reservierung'}</h3>
    <div class="zeile" style="flex-wrap:nowrap"><div style="flex:1"><label>Datum</label><input type="date" id="nDat" value="${T.datum}"></div><div style="width:90px"><label>Personen</label><input type="number" id="nPers" value="2" min="1" max="40"></div><div style="width:120px"><label>Quelle</label><select id="nQuelle"><option value="telefon">Telefon</option><option value="walkin">Walk-in</option><option value="online">Online</option><option value="google">Google</option></select></div></div>
    ${istWarte ? `<label>Wunschzeit</label><input type="time" id="nWunsch" value="19:30" step="900">` : `<label>Freie Zeiten ${vorgabe.tisch ? '(Tisch ' + esc(vorgabe.tisch) + ')' : ''}</label><div id="nSlots" class="raster"><span class="leise">lädt …</span></div>`}
    <label>Telefon</label><input id="nTel" placeholder="0664 …" autocomplete="off"><div id="nTreffer"></div>
    <div class="zeile" style="flex-wrap:nowrap"><div style="flex:1"><label>Vorname</label><input id="nVor"></div><div style="flex:1"><label>Nachname</label><input id="nNach"></div></div>
    <label>E-Mail</label><input id="nMail">
    ${istWarte ? '' : `<label>Tags</label><input id="nTags" placeholder="geburtstag, vip"><label>Notiz</label><input id="nNotiz">`}
    <div class="zeile" style="justify-content:flex-end;margin-top:12px"><button id="nAbbr">Abbrechen</button><button class="primaer" id="nOk" ${istWarte ? '' : 'disabled'}>${istWarte ? 'Eintragen' : 'Reservieren'}</button></div>`);
  let slot = null;
  const slotsLaden = async () => {
    if (istWarte) return;
    slot = null; $('#nOk', m).disabled = true;
    const r = await rpc('verfuegbarkeit.freieZeiten', $('#nDat', m).value, +$('#nPers', m).value, { alsTeam: true });
    let slots = r.slots;
    if (vorgabe.tisch) slots = slots.filter((s) => s.tische.map((x) => String(x).toUpperCase()).includes(String(vorgabe.tisch).toUpperCase())).map((s) => ({ ...s, tische: [vorgabe.tisch] }));
    $('#nSlots', m).innerHTML = slots.map((s, i) => `<button data-i="${i}" title="Tisch ${esc(s.tische.join('+'))}">${uhr(s.zeit)}</button>`).join('') || `<span class="leise">${esc(r.hinweis || 'Nichts frei')} – <a href="#" id="nZurWarte">auf die Warteliste?</a></span>`;
    m.querySelectorAll('[data-i]').forEach((k) => { k.onclick = () => { m.querySelectorAll('[data-i]').forEach((x) => x.classList.remove('an')); k.classList.add('an'); slot = slots[+k.dataset.i]; $('#nOk', m).disabled = false; }; });
    if (vorgabe.uhrzeit) { const k = [...m.querySelectorAll('[data-i]')].find((x) => minuten(slots[+x.dataset.i].zeit) >= vorgabe.uhrzeit); if (k) k.click(); }
    const w = $('#nZurWarte', m); if (w) w.onclick = (e) => { e.preventDefault(); m.remove(); neueReservierung({ warteliste: true }); };
  };
  $('#nDat', m).onchange = slotsLaden; $('#nPers', m).onchange = slotsLaden; slotsLaden();
  let suchT;
  const suchen = (feld) => { clearTimeout(suchT); suchT = setTimeout(async () => {
    const wert = feld.value; if (wert.length < 3) { $('#nTreffer', m).innerHTML = ''; return; }
    const tr = await rpc('team.gastSuchen', wert).catch(() => []);
    $('#nTreffer', m).innerHTML = tr.map((g, i) => `<div class="karte klein" style="padding:6px 8px;margin-top:4px;cursor:pointer" data-g="${i}"><b>${esc(g.vorname)} ${esc(g.nachname)}</b> · ${esc(g.telefonE164)} · ${g.anzahlBesuche} Besuche${g.anzahlNoShows ? ' · ' + g.anzahlNoShows + ' No-Shows' : ''}${g.allergien ? ' · ⚠️ ' + esc(g.allergien) : ''}</div>`).join('');
    m.querySelectorAll('[data-g]').forEach((k) => { k.onclick = () => { const g = tr[+k.dataset.g]; $('#nTel', m).value = g.telefonE164; $('#nVor', m).value = g.vorname || ''; $('#nNach', m).value = g.nachname || ''; $('#nMail', m).value = g.email || ''; $('#nTreffer', m).innerHTML = `<div class="klein leise" style="margin-top:4px">✓ Bestehender Gast${g.praeferenzen ? ' · ★ ' + esc(g.praeferenzen) : ''}</div>`; }; });
  }, 300); };
  $('#nTel', m).oninput = (e) => suchen(e.target); $('#nNach', m).oninput = (e) => suchen(e.target);
  $('#nAbbr', m).onclick = () => m.remove();
  $('#nOk', m).onclick = async () => {
    const basis = { personen: +$('#nPers', m).value, telefon: $('#nTel', m).value, vorname: $('#nVor', m).value, nachname: $('#nNach', m).value, email: $('#nMail', m).value };
    const tag = $('#nDat', m).value;
    try {
      if (istWarte) {
        const [h, mi] = $('#nWunsch', m).value.split(':').map(Number);
        await sicher(() => rpc('team.aufWarteliste', { ...basis, zeit: zeitAm(tag, h * 60 + mi) }), 'Auf der Warteliste');
      } else {
        await sicher(() => rpc('reservierungen.anlegen', { ...basis, zeit: slot.zeit, tische: slot.tische, quelle: $('#nQuelle', m).value, tags: $('#nTags', m).value.split(',').map((s) => s.trim()).filter(Boolean), notiz: $('#nNotiz', m).value }), 'Reserviert');
      }
      m.remove(); T.datum = tag; $('#datum').value = tag; laden();
    } catch (f) { /* Meldung steht schon */ }
  };
}

async function walkIn() {
  const m = modal(`<h3 style="margin-top:0">Walk-in</h3><p class="leise">Gast ohne Reservierung, sitzt ab jetzt.</p>
    <div class="zeile" style="flex-wrap:nowrap"><div style="width:100px"><label>Personen</label><input type="number" id="wPers" value="2" min="1"></div><div style="flex:1"><label>Name (optional)</label><input id="wName"></div></div>
    <label>Telefon (optional, fürs Gastprofil)</label><input id="wTel">
    <div class="zeile" style="justify-content:flex-end;margin-top:12px"><button id="wAbbr">Abbrechen</button><button class="primaer" id="wOk">Platzieren</button></div>`);
  $('#wAbbr', m).onclick = () => m.remove();
  $('#wOk', m).onclick = async () => {
    try {
      const jetzt = new Date(); const tag = isoTag(jetzt); const min = Math.floor(minuten(jetzt) / 15) * 15;
      const r = await rpc('verfuegbarkeit.freieZeiten', tag, +$('#wPers', m).value, { alsTeam: true });
      const s = r.slots.find((x) => minuten(x.zeit) >= min) || r.slots[0];
      if (!s) { melden('Gerade kein Tisch frei', true); return; }
      const name = $('#wName', m).value.trim().split(' ');
      const neu = await rpc('reservierungen.anlegen', { zeit: s.zeit, tische: s.tische, personen: +$('#wPers', m).value, telefon: $('#wTel', m).value || '+43000' + String(Date.now()).slice(-7), vorname: name[0] || 'Walk-in', nachname: name.slice(1).join(' '), quelle: 'walkin', stumm: true });
      await rpc('reservierungen.statusSetzen', neu._id, 'eingetroffen', {});
      melden(`Walk-in an Tisch ${s.tische.join('+')}`); m.remove(); T.datum = tag; $('#datum').value = tag; laden();
    } catch (f) { melden(f.message, true); }
  };
}

const GL = { suche: '', filter: 'alle', sortierung: 'name', seite: 0, daten: null, laedt: false };
let glTimer = null;
async function gaesteLaden() {
  GL.laedt = true;
  try { GL.daten = await rpc('verwaltung.gaesteListe', { suche: GL.suche, filter: GL.filter, sortierung: GL.sortierung, seite: GL.seite }); }
  catch (f) { melden(f.message, true); GL.daten = { gaeste: [], gesamt: 0, seite: 0, proSeite: 50 }; }
  GL.laedt = false; if (T.ansicht === 'gaeste') gaesteZeichnen();
}
function gaesteZeichnen() {
  if (!GL.daten && !GL.laedt) { gaesteLaden(); }
  const d = GL.daten || { gaeste: [], gesamt: 0, seite: 0, proSeite: 50 };
  const filter = [['alle', 'Alle'], ['stamm', 'Stammgäste (3+)'], ['noshow', 'Mit No-Show'], ['allergie', 'Allergien'], ['marketing', 'Newsletter-OK'], ['zh', '中文']];
  const seiten = Math.max(1, Math.ceil((d.gesamt || 0) / d.proSeite));
  $('#inhalt').innerHTML = `<div class="karte">
    <div class="zeile" style="flex-wrap:wrap;gap:6px"><input id="glSuche" placeholder="Name, Telefon oder E-Mail …" value="${esc(GL.suche)}" style="flex:1;min-width:200px">
      <select id="glSort"><option value="name" ${GL.sortierung === 'name' ? 'selected' : ''}>Name A–Z</option><option value="besuche" ${GL.sortierung === 'besuche' ? 'selected' : ''}>Meiste Besuche</option><option value="neu" ${GL.sortierung === 'neu' ? 'selected' : ''}>Neueste</option></select></div>
    <div class="zeile" style="margin:8px 0;flex-wrap:wrap;gap:4px">${filter.map(([k, v]) => `<span class="chip ${GL.filter === k ? 'an' : ''}" data-glf="${k}">${esc(v)}</span>`).join('')}<span style="flex:1"></span><span class="klein leise">${d.gesamt ?? 0} Gäste</span></div>
    ${GL.laedt && !d.gaeste.length ? '<div class="leise">Lädt …</div>' : `<table class="liste"><tr><th>Name</th><th>Kontakt</th><th>Besuche</th><th>No-Shows</th><th>Stufe</th><th></th></tr>
    ${d.gaeste.map((g) => `<tr class="reihe" data-gast="${g._id}"><td><b>${esc([g.vorname, g.nachname].filter(Boolean).join(' ') || '–')}</b>${g.tags.length ? `<div class="klein leise">${g.tags.map((x) => '#' + esc(x)).join(' ')}</div>` : ''}</td>
      <td class="klein">${String(g.telefonE164).startsWith('+43000') ? '<span class="leise">–</span>' : esc(g.telefonE164)}${g.email ? `<div>${esc(g.email)}</div>` : ''}</td>
      <td>${g.anzahlBesuche}</td><td>${g.anzahlNoShows ? `<span class="badge s-noShow">${g.anzahlNoShows}</span>` : '0'}</td><td class="klein">${esc(STUFE_TEXT[g.stufe] || 'Neu')}</td>
      <td>${g.allergien ? '⚠️' : ''}${g.sprache === 'zh' ? ' 中' : ''}${g.marketingOptIn ? ' ✉' : ''}</td></tr>`).join('')}</table>`}
    ${seiten > 1 ? `<div class="zeile" style="justify-content:center;margin-top:8px"><button class="klein" id="glZurueck" ${d.seite ? '' : 'disabled'}>‹</button><span class="klein">Seite ${d.seite + 1} / ${seiten}</span><button class="klein" id="glVor" ${d.seite + 1 < seiten ? '' : 'disabled'}>›</button></div>` : ''}
  </div>`;
  const s = $('#glSuche'); s.oninput = () => { clearTimeout(glTimer); glTimer = setTimeout(() => { GL.suche = s.value; GL.seite = 0; gaesteLaden(); }, 300); };
  if (GL.suche) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  $('#glSort').onchange = (e) => { GL.sortierung = e.target.value; GL.seite = 0; gaesteLaden(); };
  document.querySelectorAll('[data-glf]').forEach((c) => { c.onclick = () => { GL.filter = c.dataset.glf; GL.seite = 0; gaesteLaden(); }; });
  document.querySelectorAll('[data-gast]').forEach((r) => { r.onclick = () => gastProfil(r.dataset.gast); });
  if ($('#glZurueck')) $('#glZurueck').onclick = () => { GL.seite -= 1; gaesteLaden(); };
  if ($('#glVor')) $('#glVor').onclick = () => { GL.seite += 1; gaesteLaden(); };
}

async function gastProfil(id) {
  let d;

  const g = d.gast;
  const gekommen = d.reservierungen.filter((r) => ['abgeschlossen', 'abgereist', 'eingetroffen'].includes(r.status)).length;
  const m = modal(`<div class="zeile" style="justify-content:space-between"><b style="font-size:17px">${esc([g.vorname, g.nachname].filter(Boolean).join(' ') || 'Gast')}</b><button id="gpZu">Schliessen</button></div>
    <div class="klein leise">Gast seit ${g._createdDate ? datumKurz(g._createdDate).split(',')[0] : '–'} · ${esc(STUFE_TEXT[g.stufe] || 'Neu')} · ${g.anzahlBesuche} Besuche · ${g.anzahlNoShows} No-Shows · ${g.anzahlStornos} Stornos (${g.anzahlSpaeteStornos} spät)</div>
    <div class="zeile" style="flex-wrap:nowrap"><div style="flex:1"><label>Vorname</label><input id="gpVor" value="${esc(g.vorname)}"></div><div style="flex:1"><label>Nachname</label><input id="gpNach" value="${esc(g.nachname)}"></div></div>
    <div class="zeile" style="flex-wrap:nowrap"><div style="flex:1"><label>Telefon</label><input value="${esc(g.telefonE164)}" disabled></div><div style="flex:1"><label>E-Mail</label><input id="gpMail" value="${esc(g.email)}"></div></div>
    <label>Allergien / Unverträglichkeiten</label><input id="gpAll" value="${esc(g.allergien)}">
    <label>Vorlieben (Tisch, Speisen, Getränke …)</label><input id="gpPref" value="${esc(g.praeferenzen)}">
    <label>Tags (Komma)</label><input id="gpTags" value="${esc(g.tags.join(', '))}" placeholder="vip, stammgast, firma">
    <label>Interne Notiz</label><textarea id="gpNotiz" rows="2">${esc(g.notizIntern)}</textarea>
    <div class="zeile" style="gap:14px;margin-top:6px"><label class="zeile" style="gap:6px;margin:0"><input type="checkbox" id="gpMkt" ${g.marketingOptIn ? 'checked' : ''}> Newsletter / Angebote erlaubt</label>
      <label class="zeile" style="gap:6px;margin:0">Sprache <select id="gpSpr"><option value="de" ${!['zh', 'en'].includes(g.sprache) ? 'selected' : ''}>Deutsch</option><option value="en" ${g.sprache === 'en' ? 'selected' : ''}>English</option><option value="zh" ${g.sprache === 'zh' ? 'selected' : ''}>中文</option></select></label></div>
    <div class="zeile" style="justify-content:flex-end;margin-top:8px"><button class="primaer" id="gpSpeichern">Speichern</button></div>
    <h4 style="margin:14px 0 6px">Reservierungen (${d.reservierungen.length}, davon ${gekommen} besucht)</h4>
    <div style="max-height:240px;overflow:auto">${d.reservierungen.map((r) => `<div class="klein" style="padding:4px 0;border-bottom:1px solid var(--linie)"><b>${datumText(r.datumZeit)} ${uhr(r.datumZeit)}</b> · ${r.personen} P. · Tisch ${esc(r.tische.join('+') || '–')} · ${badge(r.status)} · ${esc(KANAL_TEXT[r.quelle] || r.quelle)}${r.gastWunsch ? `<div class="leise">💬 ${esc(r.gastWunsch)}</div>` : ''}</div>`).join('') || '<span class="leise klein">Keine.</span>'}</div>`);
  $('#gpZu', m).onclick = () => m.remove();
  rpc('feedback.vonGast', id).then((l) => { if (!l.length) return; const box = document.createElement('div'); box.innerHTML = `<h4 style="margin:14px 0 6px">Feedback (${l.length})</h4>${l.map((f) => `<div class="klein" style="padding:4px 0;border-bottom:1px solid var(--linie)"><span class="fb-sterne s${f.sterne}">${sterneText(f.sterne)}</span> ${f.besuchAm ? datumText(f.besuchAm) : ''}${f.kommentar ? `<div class="leise">${esc(f.kommentar)}</div>` : ''}</div>`).join('')}`; m.querySelector('.karte').appendChild(box); }).catch(() => {});
  $('#gpSpeichern', m).onclick = async () => {
    const neu = await sicher(() => rpc('verwaltung.gastAendern', id, { vorname: $('#gpVor', m).value, nachname: $('#gpNach', m).value, email: $('#gpMail', m).value, allergien: $('#gpAll', m).value, praeferenzen: $('#gpPref', m).value, tags: $('#gpTags', m).value, notizIntern: $('#gpNotiz', m).value, marketingOptIn: $('#gpMkt', m).checked, sprache: $('#gpSpr', m).value }), 'Gespeichert');
    // in der Tagesliste nachziehen
    T.buchungen.forEach((b) => { if (b.gastId && b.gastId._id === id) Object.assign(b.gastId, neu); });
    if (GL.daten) GL.daten.gaeste = GL.daten.gaeste.map((x) => (x._id === id ? neu : x));
    m.remove(); zeichnen();
  };
}

/* ---------------------------------------------------------------------
   STATISTIK
   --------------------------------------------------------------------- */
const ST = { tage: 30, daten: null, laedt: false, schluessel: '' };
async function statistikLaden() {
  const bis = isoTag(new Date()), von = tagPlus(bis, -(ST.tage - 1));
  ST.laedt = true; ST.schluessel = von + bis;
  try { ST.daten = await rpc('verwaltung.statistik', von, bis); } catch (f) { melden(f.message, true); ST.daten = null; }
  ST.laedt = false; if (T.ansicht === 'statistik') statistikZeichnen();
}
function balken(liste, wert, beschriftung, farbe = 'var(--akzent)') {
  const max = Math.max(1, ...liste.map(wert));
  return `<div class="balkenliste">${liste.map((x) => `<div class="bz"><span class="bz-l">${beschriftung(x)}</span><span class="bz-b"><i style="width:${(wert(x) / max) * 100}%;background:${farbe}"></i></span><span class="bz-w">${Math.round(wert(x) * 10) / 10}</span></div>`).join('')}</div>`;
}
function statistikZeichnen() {
  if (!ST.daten && !ST.laedt) statistikLaden();
  const d = ST.daten;
  const wahl = [7, 30, 90, 365].map((n) => `<span class="chip ${ST.tage === n ? 'an' : ''}" data-st="${n}">${n === 365 ? '1 Jahr' : n + ' Tage'}</span>`).join('');
  if (!d) { $('#inhalt').innerHTML = `<div class="karte"><div class="zeile">${wahl}</div><p class="leise">${ST.laedt ? 'Lädt …' : 'Keine Daten.'}</p></div>`; statistikEreignisse(); return; }
  const s = d.summen;
  const pz = (x) => `${Math.round(x * 1000) / 10} %`;
  const kachel = (t, w, u = '') => `<div class="kachel"><div class="klein leise">${t}</div><div class="kachel-w">${w}</div>${u ? `<div class="klein leise">${u}</div>` : ''}</div>`;
  const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const maxTag = Math.max(1, ...d.tage.map((t) => t.personen));
  $('#inhalt').innerHTML = `<div class="karte">
    <div class="zeile" style="justify-content:space-between;flex-wrap:wrap"><div class="zeile">${wahl}</div><span class="klein leise">${datumText(d.von + 'T12:00:00Z')} – ${datumText(d.bis + 'T12:00:00Z')} · ${d.plaetze} Plätze</span></div>
    <div class="kacheln">
      ${kachel('Gäste', s.personen, `${Math.round(s.personenProTag)} pro Tag`)}
      ${kachel('Reservierungen', s.reservierungen, `${s.walkins} Walk-ins`)}
      ${kachel('Auslastung', pz(s.auslastung), '2 Services pro Tag')}
      ${kachel('No-Show-Quote', pz(s.noShowQuote), `${s.noShows} No-Shows`)}
      ${kachel('Storno-Quote', pz(s.stornoQuote), `${s.spaetStornos} spät storniert`)}
      ${kachel('Ø Gruppe', Math.round(s.gruppeDurchschnitt * 10) / 10, 'Personen')}
      ${kachel('Ø Vorlauf', Math.round(s.vorlaufTage * 10) / 10 + ' Tage', 'zwischen Buchung und Besuch')}
      ${kachel('Verschiedene Gäste', s.gaeste)}
    </div>
    <h4>Gäste pro Tag <span class="klein leise">(<span style="color:#d97706">■</span> Mittag <span style="color:var(--akzent)">■</span> Abend)</span></h4>
    <div class="tagesbalken">${d.tage.map((t) => `<div class="tb" title="${datumText(t.datum + 'T12:00:00Z')}: ${t.personen} Gäste (Mittag ${t.mittag}, Abend ${t.abend})${t.noShows ? ', ' + t.noShows + ' No-Show' : ''}"><i class="tb-a" style="height:${(t.abend / maxTag) * 100}%"></i><i class="tb-m" style="height:${(t.mittag / maxTag) * 100}%"></i><span>${d.tage.length <= 31 ? +t.datum.slice(8) : ''}</span></div>`).join('')}</div>
    <div class="statspalten">
      <div><h4>Kanäle</h4>${balken(Object.entries(d.kanaele).map(([k, n]) => ({ k, n })).sort((a, c) => c.n - a.n), (x) => x.n, (x) => esc(KANAL_TEXT[x.k] || x.k))}</div>
      <div><h4>Ø Gäste je Wochentag</h4>${balken([1, 2, 3, 4, 5, 6, 0].map((i) => d.wochentage[i]), (x) => x.personen, (x) => WT[x.tag])}</div>
      <div><h4>Ankünfte nach Uhrzeit</h4>${balken(d.stunden, (x) => x.personen, (x) => x.stunde + ':00')}</div>
      <div><h4>Meistgebuchte Tische</h4>${balken(d.tische.slice(0, 10), (x) => x.buchungen, (x) => 'Tisch ' + esc(x.nummer))}</div>
    </div></div>`;
  statistikEreignisse();
}
function statistikEreignisse() { document.querySelectorAll('[data-st]').forEach((c) => { c.onclick = () => { ST.tage = +c.dataset.st; ST.daten = null; statistikLaden(); statistikZeichnen(); }; }); }

/* ---------------------------------------------------------------------
   DRUCKEN – Tagesliste fürs Team (Papier am Pass)
   --------------------------------------------------------------------- */
function tageslisteDrucken() {
  const liste = sichtbar().filter((b) => !INAKTIV.includes(b.status)).sort((a, c) => new Date(a.datumZeit) - new Date(c.datumZeit));
  const pers = liste.reduce((s, b) => s + b.personen, 0);
  let d = document.getElementById('druck');
  if (!d) { d = document.createElement('div'); d.id = 'druck'; document.body.appendChild(d); }
  const zeile = (b) => { const g = b.gastId && typeof b.gastId === 'object' ? b.gastId : {}; const tel = String(g.telefonE164 || '').startsWith('+43000') ? '' : g.telefonE164 || '';
    return `<tr><td><b>${uhr(b.datumZeit)}</b></td><td>${b.personen}</td><td><b>${esc((b.tische || []).join('+') || '–')}</b></td><td>${esc(gastName(b))}${g.anzahlBesuche >= 3 ? ' ★' : ''}</td><td>${esc(tel)}</td>
      <td>${g.allergien ? '<b>⚠ ' + esc(g.allergien) + '</b> ' : ''}${esc([b.gastWunsch, b.notiz, (b.tags || []).map((t) => '#' + t).join(' ')].filter(Boolean).join(' · '))}</td><td>${esc(STATUS_TEXT[b.status] || b.status)}</td></tr>`; };
  const teil = (titel, l) => (l.length ? `<h3>${titel} · ${l.reduce((s, b) => s + b.personen, 0)} Pers. · ${l.length} Res.</h3><table><tr><th>Zeit</th><th>P.</th><th>Tisch</th><th>Gast</th><th>Telefon</th><th>Allergien · Wünsche · Notizen</th><th>Status</th></tr>${l.map(zeile).join('')}</table>` : '');
  d.innerHTML = `<h2>Restaurant Sichuan · ${datumText(T.datum + 'T12:00:00Z')} · ${pers} Personen</h2>
    ${T.notiz ? `<p><b>Tagesnotiz:</b> ${esc(T.notiz)}</p>` : ''}
    ${teil('Mittag', liste.filter((b) => minuten(b.datumZeit) < 16 * 60))}${teil('Abend', liste.filter((b) => minuten(b.datumZeit) >= 16 * 60))}
    <p class="klein">Gedruckt ${datumKurz(new Date())}</p>`;
  window.print();
}

/* ---------------------------------------------------------------------
   FEEDBACK – Gastseite (Link aus Mail/SMS) und Auswertung fürs Team
   --------------------------------------------------------------------- */
const FBG = { stand: null, wahl: { sterne: 0, essen: 0, service: 0, ambiente: 0 }, fertig: null };
async function feedbackStart() {
  try { FBG.stand = await rpc('feedback.laden', INIT.token); } catch (f) { $('#wurzel').innerHTML = `<div class="gast"><h1>Link ungültig</h1><p>${esc(f.message)}</p></div>`; return; }
  if (FBG.stand.abgegeben) FBG.fertig = FBG.stand.abgegeben;
  feedbackZeichnen();
}
const sternReihe = (k, wert, gross) => `<div class="sterne ${gross ? 'gross' : ''}" data-reihe="${k}">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-s="${n}" class="${n <= wert ? 'an' : ''}" aria-label="${n}">★</button>`).join('')}</div>`;
function feedbackZeichnen() {
  const s = FBG.stand, w = FBG.wahl;
  if (FBG.fertig) {
    const gut = FBG.fertig.sterne >= 4;
    $('#wurzel').innerHTML = `<div class="gast"><div class="leise">Restaurant Sichuan · Wien</div><h1>Herzlichen Dank!</h1>
      <div class="karte">${gut ? `<p>Es freut uns sehr, dass es Ihnen geschmeckt hat.</p><p>Würden Sie Ihre Erfahrung auch auf Google teilen? Das hilft uns sehr.</p>
        <a class="knopf primaer" id="fbGoogle" href="${esc(FBG.fertig.googleLink)}" target="_blank" rel="noopener">Auf Google bewerten</a>`
        : `<p>Danke für Ihre ehrliche Rückmeldung. Wir nehmen sie ernst und melden uns gegebenenfalls persönlich bei Ihnen.</p>`}</div>
      <div class="marke">Eigenes Reservierungssystem · Test</div></div>`;
    const g = $('#fbGoogle'); if (g) g.onclick = () => { rpc('feedback.googleGeklickt', INIT.token).catch(() => {}); };
    return;
  }
  $('#wurzel').innerHTML = `<div class="gast"><div class="leise">Restaurant Sichuan · Wien</div><h1>${s.vorname ? 'Hallo ' + esc(s.vorname) : 'Wie war Ihr Besuch?'}</h1>
    <p class="leise">${datumText(s.zeit)} · ${uhr(s.zeit)} Uhr · ${s.personen} ${s.personen === 1 ? 'Person' : 'Personen'}</p>
    ${s.besucht ? `<div class="karte">
      <h2 style="margin-top:0">Wie zufrieden waren Sie insgesamt?</h2>${sternReihe('sterne', w.sterne, true)}
      <div class="fb-teile">${[['essen', 'Essen'], ['service', 'Service'], ['ambiente', 'Ambiente']].map(([k, t]) => `<div class="fb-teil"><span>${t}</span>${sternReihe(k, w[k])}</div>`).join('')}</div>
      <label>Möchten Sie uns noch etwas sagen? (optional)</label><textarea id="fbText" rows="4" placeholder="Was war besonders gut – oder was sollen wir besser machen?"></textarea>
      <button class="primaer" id="fbOk" style="width:100%;margin-top:14px;padding:12px" ${w.sterne ? '' : 'disabled'}>Feedback senden</button></div>`
    : `<div class="karte">Feedback ist nach Ihrem Besuch möglich.</div>`}
    <div class="marke">Eigenes Reservierungssystem · Test</div></div>`;
  document.querySelectorAll('.sterne').forEach((r) => r.querySelectorAll('[data-s]').forEach((b) => { b.onclick = () => { const text = $('#fbText')?.value; w[r.dataset.reihe] = +b.dataset.s; feedbackZeichnen(); if (text) $('#fbText').value = text; }; }));
  const ok = $('#fbOk'); if (ok) ok.onclick = async () => {
    ok.disabled = true;
    try { FBG.fertig = await rpc('feedback.abgeben', INIT.token, { sterne: w.sterne, essen: w.essen || null, service: w.service || null, ambiente: w.ambiente || null, kommentar: $('#fbText').value }); feedbackZeichnen(); }
    catch (f) { melden(f.message, true); ok.disabled = false; }
  };
}

function qrSvg(text, px = 160) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), r = 2, gr = n + r * 2;
  let pfad = '';
  for (let y = 0; y < n; y += 1) for (let x = 0; x < n; x += 1) if (q.isDark(y, x)) pfad += `M${x + r},${y + r}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${gr} ${gr}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect width="${gr}" height="${gr}" fill="#fff"/><path d="${pfad}" fill="#000"/></svg>`;
}
function qrDrucken(d) {
  const m = modal(`<b style="font-size:16px">QR-Codes für die Tische</b>
    <p class="klein leise">Jeder Code öffnet die Speisekarte in der Sprache des Handys (DE/EN/中文). Mit Tischnummer, damit ihr später sehen könnt, wo gescannt wurde.</p>
    <label class="zeile" style="gap:6px"><input type="radio" name="qrArt" value="tische" checked> ein Code pro Tisch</label>
    <label class="zeile" style="gap:6px"><input type="radio" name="qrArt" value="einer"> ein allgemeiner Code (Fenster, Flyer)</label>
    <div class="zeile" style="justify-content:flex-end;margin-top:12px"><button id="qrAbbr">Abbrechen</button><button class="primaer" id="qrOk">Drucken</button></div>`);
  $('#qrAbbr', m).onclick = () => m.remove();
  $('#qrOk', m).onclick = () => {
    const einer = m.querySelector('[name=qrArt]:checked').value === 'einer';
    const ziele = einer ? [{ nr: '', url: d.kartenUrl }] : [...d.tische].sort((a, b) => a.localeCompare(b, 'de', { numeric: true })).map((nr) => ({ nr, url: `${d.kartenUrl}?tisch=${encodeURIComponent(nr)}` }));
    let el = document.getElementById('druck'); if (!el) { el = document.createElement('div'); el.id = 'druck'; document.body.appendChild(el); }
    el.innerHTML = `<div class="qr-blatt">${ziele.map((z) => `<div class="qr-karte">${qrSvg(z.url, einer ? 320 : 150)}<div class="qr-titel">四川 Restaurant Sichuan</div><div>Speisekarte · Menu · 菜单</div>${z.nr ? `<div class="qr-tisch">Tisch ${esc(z.nr)}</div>` : ''}</div>`).join('')}</div>`;
    m.remove(); window.print();
  };
}

const B = { events: [], eventHinweis: '', bereich: '', personen: 2, datum: null, tage: [], slots: [], slot: null, hinweis: '', warteliste: false, zurWarte: false };

async function tageLaden() {

async function slotsLaden() {

const G = { stand: null, aendern: false, nurWeniger: false, wahl: null };
async function gastStart() {
  document.body.insertAdjacentHTML('beforeend', spracheKnopf().replace('sprachwahl', 'sprachwahl schwebend'));
  if (!INIT.token) { $('#wurzel').innerHTML = `<div class="gast"><h1>Link unvollständig</h1><p>Bitte öffnen Sie den Link aus Ihrer SMS oder E-Mail.</p></div>`; return; }
  if ((INIT.absicht || INIT.ansicht) === 'feedback') return feedbackStart();
  if ((INIT.absicht || INIT.ansicht) === 'abmelden') return abmeldenStart();
  if (INIT.absicht === 'bezahlt' && INIT.sitzung) { try { await rpc('zahlung.buchungZahlungPruefen', INIT.token, INIT.sitzung); } catch (f) { melden(f.message, true); } }
  try { G.stand = await rpc('gastverwaltung.laden', INIT.token); } catch (f) { $('#wurzel').innerHTML = `<div class="gast"><h1>Link ungültig</h1><p>${esc(f.message)}</p></div>`; return; }
  if (INIT.absicht === 'rueckbestaetigen' && G.stand.darfRueckbestaetigen) { await gastAktion('rueckbestaetigen', 'Danke! Wir haben Ihren Tisch fest eingeplant.'); return; }
  gastZeichnen();
}
async function gastAktion(methode, meldung, ...args) {
  try { G.stand = await rpc('gastverwaltung.' + methode, INIT.token, ...args); G.aendern = false; gastZeichnen(); melden(meldung); } catch (f) { melden(f.message, true); }
}
function gastZeichnen() {
  const s = G.stand;
  $('#wurzel').innerHTML = `<div class="gast"><div class="leise">Restaurant Sichuan</div><h1>${s.vorname ? 'Hallo ' + esc(s.vorname) : 'Ihre Reservierung'}</h1>
    <div class="karte"><div class="fett" style="font-size:18px">${datumText(s.zeit)} · ${uhr(s.zeit)} Uhr</div><div>${s.personen} ${s.personen === 1 ? 'Person' : 'Personen'}</div><div style="margin-top:6px">${badge(s.status)}</div>
    ${s.angebotOffen ? `<p><b>Für Sie reserviert bis ${uhr(s.angebotBis)} Uhr.</b></p><div class="zeile"><button class="primaer" id="annehmen">Annehmen</button><button id="ablehnen">Nein danke</button></div>` : ''}</div>
    ${zahlungGastHtml(s.zahlung)}
    ${s.darfRueckbestaetigen ? `<button class="primaer" id="rueck" style="width:100%;margin-top:14px;padding:12px">Ich komme ✓</button>` : ''}
    ${s.stornoGiltAlsSpaet && s.darfStornieren && s.status !== 'warteliste' ? `<div class="karte" style="margin-top:14px;background:#fffbeb"><b>Ihr Termin ist in weniger als ${s.stornofristStunden} Stunden.</b><br>Eine Absage jetzt lässt den Tisch meist leer. Kommen Sie mit weniger Personen? Dann passen Sie lieber die Anzahl an.${s.personen > 1 ? `<div style="margin-top:8px"><button id="weniger">Personenzahl verringern</button></div>` : ''}</div>` : ''}
    <div class="zeile" style="margin-top:14px">${s.darfAendern ? `<button id="aendern">Ändern</button>` : ''}${s.darfStornieren ? `<button id="storno">${s.status === 'warteliste' ? 'Von der Warteliste nehmen' : 'Stornieren'}</button>` : ''}</div>
    <div id="aendernBox" class="${G.aendern ? '' : 'versteckt'}">
      <h2>${G.nurWeniger ? 'Personenzahl' : 'Reservierung ändern'}</h2>
      <div class="zeile" style="flex-wrap:nowrap">${G.nurWeniger ? '' : `<div style="flex:1"><label>Datum</label><input type="date" id="aDat" value="${isoTag(s.zeit)}"></div>`}<div style="width:100px"><label>Personen</label><input type="number" id="aPers" min="1" max="${G.nurWeniger ? s.personen : 8}" value="${G.nurWeniger ? Math.max(1, s.personen - 1) : s.personen}"></div></div>
      ${G.nurWeniger ? '' : `<label>Uhrzeit</label><div class="raster" id="aSlots"></div>`}
      <label>Wünsche</label><textarea id="aWunsch" rows="2">${esc(s.gastWunsch)}</textarea>
      <button class="primaer" id="aOk" style="width:100%;margin-top:12px">Speichern</button>
    </div>
    <div class="marke">Eigenes Reservierungssystem · Test</div></div>`;
  const an = (id, fn) => { const e = $('#' + id); if (e) e.onclick = fn; };
  an('annehmen', () => gastAktion('angebotAnnehmen', 'Wunderbar – Ihr Tisch ist bestätigt.'));
  an('ablehnen', () => gastAktion('angebotAblehnen', 'Schade. Wir geben den Tisch weiter.'));
  an('rueck', () => gastAktion('rueckbestaetigen', 'Danke! Wir freuen uns auf Sie.'));
  an('zahlen', () => zahlungStarten(INIT.token));
  an('storno', () => { if (confirm(s.stornoGiltAlsSpaet ? 'Die Frist ist abgelaufen – die Absage zählt als spät. Trotzdem stornieren?' : 'Reservierung wirklich stornieren?')) gastAktion('stornieren', 'Storniert.'); });
  an('aendern', () => { G.aendern = true; G.nurWeniger = false; gastZeichnen(); gastSlots(); });
  an('weniger', () => { G.aendern = true; G.nurWeniger = true; gastZeichnen(); });
  an('aOk', () => {
    const aend = { personen: +$('#aPers').value, gastWunsch: $('#aWunsch').value };
    if (!G.nurWeniger && G.wahl && G.wahl !== s.zeit) aend.zeit = G.wahl;
    gastAktion('aendern', 'Gespeichert – Sie bekommen eine neue Bestätigung.', aend);
  });
  const d = $('#aDat'); if (d) d.onchange = gastSlots;
  const p = $('#aPers'); if (p && !G.nurWeniger) p.onchange = gastSlots;
}
async function gastSlots() {
  const s = G.stand; G.wahl = s.zeit;
  const tag = $('#aDat').value, pers = +$('#aPers').value;
  $('#aSlots').innerHTML = '<span class="leise">lädt …</span>';
  const r = await rpc('verfuegbarkeit.freieZeiten', tag, pers);
  const liste = (isoTag(s.zeit) === tag ? [{ zeit: s.zeit, bisher: true }] : []).concat(r.slots.filter((x) => x.zeit !== s.zeit));
  liste.sort((a, b) => new Date(a.zeit) - new Date(b.zeit));
  $('#aSlots').innerHTML = liste.map((x) => `<button data-z="${x.zeit}" class="${x.zeit === G.wahl ? 'an' : ''}">${uhr(x.zeit)}${x.bisher ? '*' : ''}</button>`).join('') || `<span class="leise">${esc(r.hinweis || 'nichts frei')}</span>`;
  document.querySelectorAll('#aSlots [data-z]').forEach((k) => { k.onclick = () => { G.wahl = k.dataset.z; document.querySelectorAll('#aSlots [data-z]').forEach((x) => x.classList.toggle('an', x === k)); }; });
}

/* =====================================================================
   ZAHLUNG (Stripe) – Gutscheine, Tickets, Anzahlung, Reservierungsgarantie
   ===================================================================== */
let ZO = null; // öffentliche Zahlungseinstellungen
const ZART_TEXT = { ticket: 'Ticket vorab', anzahlung: 'Anzahlung', garantie: 'Reservierungsgarantie' };
const ZSTATUS_TEXT = { offen: 'offen', bezahlt: 'bezahlt', garantiert: 'Karte hinterlegt', abgebucht: 'Gebühr abgebucht', erstattet: 'erstattet', abgelaufen: 'abgelaufen' };
const euroC = (c) => euro((Number(c) || 0) / 100);
const L3 = (o) => o[SPRACHE] || o.de;

/** Welche Zahlung käme auf den Gast zu? Gleiche Reihenfolge wie im Backend (nur Anzeige). */
function zahlungVorschau(personen, datum, ev) {
  if (!ZO || !ZO.bereit) return null;
  if (ev) {
    if (!ZO.events || !ev.zahlungsart || ev.zahlungsart === 'keine') return null;
    const pp = ev.zahlungsart === 'ticket' ? ev.preisProPerson : (ev.zahlungProPerson ?? ev.preisProPerson);
    return pp > 0 ? { art: ev.zahlungsart, pp } : null;
  }
  const tag = (ZO.sondertage || []).find((t) => t.datum === datum && personen >= t.abPersonen);
  if (tag) return { art: tag.art, pp: tag.proPerson, titel: tag.titel };
  if (ZO.anzahlung && personen >= ZO.anzahlung.abPersonen) return { art: 'anzahlung', pp: ZO.anzahlung.proPerson };
  if (ZO.garantie && personen >= ZO.garantie.abPersonen) return { art: 'garantie', pp: ZO.garantie.proPerson };
  return null;
}
function zahlungsHinweisHtml(personen, datum, ev) {
  const z = zahlungVorschau(personen, datum, ev); if (!z) return '';
  const pp = euro(z.pp), ges = euro(z.pp * personen), anlass = z.titel ? `${esc(z.titel)}: ` : '';
  const text = z.art === 'garantie'
    ? L3({ de: `${anlass}Für diese Reservierung hinterlegen Sie im nächsten Schritt Ihre Karte als Garantie. Sie wird nicht belastet – nur bei Nichterscheinen oder später Absage berechnen wir ${pp} pro Person.`, en: `${anlass}For this reservation you will leave your card as a guarantee in the next step. It will not be charged – only for a no-show or late cancellation we charge ${pp} per person.`, zh: `${anlass}此预订需在下一步提供信用卡担保，不会扣款——仅在未到店或迟取消时每人收取 ${pp}。` })
    : z.art === 'ticket'
      ? L3({ de: `Im nächsten Schritt bezahlen Sie das Ticket: ${personen} × ${pp} = ${ges}.`, en: `In the next step you pay for the ticket: ${personen} × ${pp} = ${ges}.`, zh: `下一步支付门票：${personen} × ${pp} = ${ges}。` })
      : L3({ de: `${anlass}Für diese Reservierung bitten wir um eine Anzahlung von ${pp} pro Person (${ges}), die wir auf Ihre Rechnung anrechnen.`, en: `${anlass}For this reservation we ask for a deposit of ${pp} per person (${ges}), deducted from your bill.`, zh: `${anlass}此预订需支付每人 ${pp} 的订金（共 ${ges}），将从账单中扣除。` });
  return `<div class="karte klein" style="margin-top:12px;background:#f8fafc">💳 ${text}</div>`;
}
async function zahlungStarten(token, knopf) {
  if (knopf) knopf.disabled = true;
  try { const r = await rpc('zahlung.buchungZahlungStarten', token); urlOeffnen(r.url); }
  catch (f) { melden(f.message, true); if (knopf) knopf.disabled = false; }
}
/** Nach dem Buchen: Tisch ist gehalten, Zahlung fehlt noch. */
function zahlungAusstehendZeigen(r, titel) {
  const z = r.zahlung;
  $('#wurzel').innerHTML = `<div class="gast"><div class="leise">Restaurant Sichuan · Wien</div><h1>${L3({ de: 'Fast geschafft', en: 'Almost done', zh: '即将完成' })}</h1>
    <div class="karte">${titel ? `<div class="fett" style="font-size:17px">${esc(titel)}</div>` : ''}<div class="fett">${datumText(r.zeit)} · ${uhr(r.zeit)} Uhr · ${r.personen} Pers.</div>
      <p>${esc(z.text)}</p>
      <p class="klein leise">${L3({ de: `Ihr Tisch ist bis ${uhr(z.frist)} Uhr für Sie gehalten. Ohne Abschluss geben wir ihn danach wieder frei.`, en: `Your table is held for you until ${uhr(z.frist)}. Without completion it will be released afterwards.`, zh: `您的座位保留至 ${uhr(z.frist)}，逾时未完成将释放。` })}</p></div>
    <button class="primaer" id="zWeiter" style="width:100%;margin-top:14px;padding:12px">${z.art === 'garantie' ? L3({ de: 'Karte hinterlegen', en: 'Add card', zh: '提供信用卡' }) : L3({ de: `Weiter zur Zahlung · ${euroC(z.betragCent)}`, en: `Continue to payment · ${euroC(z.betragCent)}`, zh: `去付款 · ${euroC(z.betragCent)}` })}</button>
    <p class="klein leise" style="text-align:center">${L3({ de: 'Sichere Zahlung über Stripe', en: 'Secure payment via Stripe', zh: '通过 Stripe 安全支付' })}</p></div>`;
  $('#zWeiter').onclick = (e) => zahlungStarten(r.verwaltungsToken, e.target);
}
/** Gastseite: Zahlungsstand. */
function zahlungGastHtml(z) {
  if (!z) return '';
  if (z.darfZahlen) return `<div class="karte" style="margin-top:14px;background:#fffbeb"><b>${z.art === 'garantie' ? L3({ de: 'Reservierungsgarantie offen', en: 'Card guarantee pending', zh: '待提供信用卡担保' }) : L3({ de: 'Zahlung offen', en: 'Payment pending', zh: '待付款' })}</b><p class="klein">${esc(z.text)}</p>
    <button class="primaer" id="zahlen">${z.art === 'garantie' ? L3({ de: 'Karte hinterlegen', en: 'Add card', zh: '提供信用卡' }) : L3({ de: `Jetzt bezahlen · ${euroC(z.betragCent)}`, en: `Pay now · ${euroC(z.betragCent)}`, zh: `立即付款 · ${euroC(z.betragCent)}` })}</button>
