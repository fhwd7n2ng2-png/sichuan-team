*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer;border:1px solid var(--linie);background:var(--karte);border-radius:8px;padding:7px 12px;color:var(--text)}
button:hover{border-color:#bbb}button.primaer{background:var(--akzent);border-color:var(--akzent);color:#fff}
button.klein{padding:4px 8px;font-size:12px}button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--linie);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
label{display:block;font-size:12px;color:var(--leise);margin:8px 0 3px}
.zeile{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.leise{color:var(--leise)}.klein{font-size:12px}.fett{font-weight:600}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:var(--radius);padding:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--linie);border-radius:999px;padding:3px 10px;font-size:12px;background:#fff;cursor:pointer;white-space:nowrap}
.chip.an{background:var(--text);color:#fff;border-color:var(--text)}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.s-warteliste{background:#ede9fe;color:#5b21b6}.s-angefragt{background:#fef3c7;color:#92400e}.s-bestaetigt{background:#dbeafe;color:#1e40af}
.s-rueckbestaetigt{background:#dcfce7;color:#166534}.s-zeitvorschlag{background:#fae8ff;color:#86198f}.s-wartet_drinnen{background:#ffedd5;color:#9a3412}
.s-eingetroffen{background:#15803d;color:#fff}.s-abgeschlossen,.s-abgereist{background:#e5e7eb;color:#374151}
.s-storniert,.s-spaet_storniert{background:#f3f4f6;color:#9ca3af;text-decoration:line-through}.s-noShow{background:#fee2e2;color:#991b1b}
.r-hoch{background:#fee2e2;color:#991b1b}.r-mittel{background:#fef3c7;color:#92400e}.r-niedrig{background:#f0fdf4;color:#166534}
.versteckt{display:none!important}
#hinweis{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;z-index:50;max-width:90%}

.modal .karte{width:min(560px,100%)}
.team{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
.leiste{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#1d1d1f;color:#fff;flex-wrap:wrap}

.leiste input,.leiste select{width:auto;background:#2c2c2e;color:#fff;border-color:#3a3a3c}
.tabs button{border-radius:0;border-left-width:0}.tabs button:first-child{border-radius:8px 0 0 8px;border-left-width:1px}.tabs button:last-child{border-radius:0 8px 8px 0}

.kennzahlen{display:flex;gap:16px;padding:8px 14px;border-bottom:1px solid var(--linie);background:#fff;flex-wrap:wrap;align-items:center}

.liste tr.reihe{cursor:pointer}.liste tr.reihe:hover{background:#fafaf8}.liste tr.gewaehlt{background:#fff7ed}
.liste .zeit{font-variant-numeric:tabular-nums;font-weight:600;width:56px}

.tl-std{position:absolute;top:5px;font-size:11px;color:var(--leise)}
.tl-zeile{position:relative;height:34px;border-bottom:1px solid #f0efeb}
.tl-name{position:sticky;left:0;width:64px;height:100%;display:flex;align-items:center;padding-left:8px;font-weight:600;background:#fff;z-index:2;border-right:1px solid var(--linie);font-size:12px}
.tl-balken{position:absolute;top:4px;height:26px;border-radius:6px;padding:2px 6px;font-size:11px;overflow:hidden;white-space:nowrap;cursor:pointer;border:1px solid rgba(0,0,0,.08)}

.tl-jetzt{position:absolute;top:0;bottom:0;width:2px;background:var(--akzent2);z-index:2}
.tl-gruppe{background:#f6f5f2;font-size:11px;font-weight:700;padding:4px 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--leise)}
.plan{position:relative;background:#fff;border:1px solid var(--linie);border-radius:var(--radius);overflow:auto}
.tisch{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #d4d4d8;background:#fafafa;border-radius:8px;font-size:11px;cursor:pointer;text-align:center;line-height:1.15}
.tisch.rund{border-radius:50%}.tisch .nr{font-weight:700;font-size:13px}
.tisch.belegt{background:#dbeafe;border-color:#3b82f6}.tisch.da{background:#dcfce7;border-color:#16a34a}.tisch.bald{background:#fef3c7;border-color:#d97706}
.tisch.inaktiv{opacity:.35}
.gast{max-width:620px;margin:0 auto;padding:18px 14px 40px}
.gast h1{font-size:22px;margin:4px 0 2px}.gast h2{font-size:15px;margin:18px 0 8px}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}.raster>span{grid-column:1/-1}
.raster button{padding:10px 0}.raster button.an{background:var(--akzent);color:#fff;border-color:var(--akzent)}
.tage{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tag{min-width:62px;text-align:center;padding:8px 4px;border:1px solid var(--linie);border-radius:10px;background:#fff;cursor:pointer}
.tag.an{background:var(--akzent);color:#fff;border-color:var(--akzent)}.tag.voll{opacity:.4}
.tag .wt{font-size:11px;text-transform:uppercase}.tag .nr{font-size:18px;font-weight:700}
.marke{font-size:11px;color:var(--leise);text-align:center;margin-top:28px}

<script>
'use strict';
/* ---------- Brücke zur Wix-Seite ---------- */
const offen = new Map(); let laufNr = 0; let INIT = null;

const ALLEIN = window.parent === window;
const KONFIG = window.SICHUAN_KONFIG || {};
const BASIS = String(KONFIG.website || location.href.replace(/\/_functions\/.*$/, '')).replace(/\/$/, '');
const API_URL = KONFIG.api || 'api';
const speicher = {
  lesen(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } },
  schreiben(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch { /* privat */ } }
};
let SITZUNG = ALLEIN ? speicher.lesen('sichuan.sitzung') : null;
async function rpc(methode, ...args) {
  if (ALLEIN) {
    let r;
    try {
      // text/plain + Token im Body = einfache CORS-Anfrage ohne Preflight
      r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ methode, args, token: SITZUNG ? SITZUNG.token : '' }) });
    } catch { throw new Error('Keine Internetverbindung.'); }

    if (!d.ok) throw new Error(d.fehler || 'Unbekannter Fehler.');
    return d.daten;
  }
  return new Promise((ok, nein) => {
    const id = ++laufNr; offen.set(id, { ok, nein });
    window.parent.postMessage({ typ: 'rpc', id, methode, args: JSON.parse(JSON.stringify(args)) }, '*');
    setTimeout(() => { if (offen.has(id)) { offen.delete(id); nein(new Error('Keine Antwort vom Server.')); } }, 60000);
  });
}
window.addEventListener('message', (e) => {
  const d = e.data; if (!d || typeof d !== 'object') return;

/** Wix-Seite öffnen: eingebettet über die Seite, als App in einem neuen Fenster. */
function seiteOeffnen(ziel) {

  window.open(BASIS + pfad, '_blank', 'noopener');
}
function urlOeffnen(url) {
  if (!ALLEIN) window.parent.postMessage({ typ: 'oeffnen', url }, '*');

}
function abmeldenLokal() { SITZUNG = null; speicher.schreiben('sichuan.sitzung', null); INIT = null; anmeldungZeigen(); }
async function abmelden() { try { await rpc('zugang.abmelden'); } catch { /* egal */ } abmeldenLokal(); }
function anmeldungZeigen(fehler = '') {
  let pin = '';
  $('#wurzel').innerHTML = `<div class="anmeldung"><div class="box">
    <h1>四川 Sichuan</h1><p>Team-App · PIN eingeben</p><p style="margin-top:-12px">${spracheKnopf()}</p>
    <div class="pin-punkte" id="punkte"></div>

    <div class="fehlertext" id="pinfehler">${esc(fehler)}</div></div></div>`;
  const punkte = () => { $('#punkte').innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<i class="${i < pin.length ? 'voll' : ''}"></i>`).join(''); };
  const senden = async () => {
    if (pin.length < 4) return;
    $('#pinfehler').textContent = 'Prüfe …';
    try {
      const r = await rpc('zugang.anmelden', pin);
      SITZUNG = { token: r.token, name: r.name, rolle: r.rolle, seiten: r.seiten };
      speicher.schreiben('sichuan.sitzung', SITZUNG);
      INIT = { modus: 'team' }; start();
    } catch (f) { pin = ''; punkte(); $('#pinfehler').textContent = f.message; }
  };
  const taste = (z) => {
    if (z === 'weg') pin = pin.slice(0, -1);
    else if (z === 'los') return senden();
    else if (pin.length < 8) pin += z;
    punkte(); $('#pinfehler').textContent = '';
    if (pin.length === 8) senden();
  };
  document.querySelectorAll('.pin-tasten button').forEach((b) => { b.onclick = () => taste(b.dataset.z); });
  document.onkeydown = (e) => { if (!$('.anmeldung')) return; if (/^\d$/.test(e.key)) taste(e.key); else if (e.key === 'Backspace') taste('weg'); else if (e.key === 'Enter') taste('los'); };
  punkte();

if (ALLEIN) {
  document.body.classList.add('allein');
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  setTimeout(() => { if (SITZUNG) { INIT = { modus: 'team' }; start(); } else anmeldungZeigen(); }, 0);

  window.parent.postMessage({ typ: 'bereit' }, '*');
  setInterval(() => { if (!INIT) window.parent.postMessage({ typ: 'bereit' }, '*'); }, 1500);
}

    $('#tvListe', m).innerHTML = liste.length ? `<table class="liste"><tr><th>Name</th><th>Rolle</th><th>Status</th><th></th></tr>${liste.map((x) => `<tr><td>${esc(x.name)}</td><td>${esc(x.rolle)}</td><td>${x.aktiv ? 'aktiv' : '<span class="leise">gesperrt</span>'}</td><td style="text-align:right;white-space:nowrap"><button class="klein" data-pin="${x._id}">Neue PIN</button> <button class="klein" data-aktiv="${x._id}">${x.aktiv ? 'Sperren' : 'Freigeben'}</button></td></tr>`).join('')}</table>` : '<p class="leise">Noch niemand angelegt. Leg zuerst dich selbst als Admin an.</p>';
    m.querySelectorAll('[data-pin]').forEach((b) => { b.onclick = async () => { const pin = prompt('Neue PIN (4–8 Ziffern):'); if (!pin) return; await sicher(() => rpc('zugang.mitgliedAendern', b.dataset.pin, { pin }), 'PIN geändert – alte Anmeldungen sind beendet'); }; });
    m.querySelectorAll('[data-aktiv]').forEach((b) => { b.onclick = async () => { const x = liste.find((y) => y._id === b.dataset.aktiv); const neu = await sicher(() => rpc('zugang.mitgliedAendern', x._id, { aktiv: !x.aktiv }), x.aktiv ? 'Gesperrt' : 'Freigegeben'); Object.assign(x, neu); zeichnenListe(); }; });
  };
  zeichnenListe();
  $('#tvZu', m).onclick = () => m.remove();
  $('#tvNeu', m).onclick = async () => {
    const neu = await sicher(() => rpc('zugang.mitgliedAnlegen', { name: $('#tvName', m).value, pin: $('#tvPin', m).value, rolle: $('#tvRolle', m).value }), 'Angelegt');
    liste.push(neu); $('#tvName', m).value = ''; $('#tvPin', m).value = ''; zeichnenListe();
  };
}
function modal(html) {
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="karte">${html}</div>`;
  m.onclick = (e) => { if (e.target === m) m.remove(); };
  document.body.appendChild(m); return m;
}

/* =====================================================================
   TEAM-PORTAL
   ===================================================================== */
const T = { datum: null, ansicht: 'liste', schicht: 'alle', filter: 'alle', suche: '', buchungen: [], tische: [], timeline: null, gewaehlt: null, planZeit: null, planBereich: null, verlauf: [], notiz: '' };

function teamStart() {
  T.datum = isoTag(new Date());
  $('#wurzel').innerHTML = `
  <div class="team">
    <div class="leiste">
      <b style="font-size:15px">四川 <span class="marke-name">Sichuan</span></b>${ALLEIN && SITZUNG ? `<span class="leise klein" style="color:#a1a1a6">${esc(SITZUNG.name)}</span>` : ''}
      <button id="zurueck" title="Vortag">‹</button><input type="date" id="datum"><button id="vor" title="Folgetag">›</button><button id="heute">Heute</button>
      <select id="schicht"><option value="alle">Ganzer Tag</option><option value="mittag">Mittag</option><option value="abend">Abend</option></select>
      <div class="tabs zeile" style="gap:0"><button data-a="liste">Liste</button><button data-a="timeline">Timeline</button><button data-a="plan">Tischplan</button></div>
      <input id="suche" placeholder="Suchen …" style="width:150px">
      <span style="flex:1"></span>
      <button id="walkin">Walk-in</button><button id="warte">+ Warteliste</button><button class="primaer" id="neu">+ Reservierung</button>
      <select id="mehr"><option value="">⋯</option><option value="demo">Testdaten einrichten</option><option value="demoweg">Testdaten löschen</option><option value="nachr">Warteliste jetzt prüfen</option><option value="buchung">Buchungswidget öffnen</option><option value="team">Team &amp; PINs</option><option value="sprache">${SPRACHE === 'zh' ? 'Deutsch' : '中文'}</option>${ALLEIN ? '<option value="abmelden">Abmelden</option>' : ''}</select>
    </div>
    <div class="kennzahlen" id="kennzahlen"></div>
    <div class="haupt"><div class="inhalt" id="inhalt"></div><div class="seite" id="seite"></div></div>
  </div>`;
  $('#datum').value = T.datum;
  const datumSetzen = (d) => { T.datum = d; $('#datum').value = d; T.planZeit = null; laden(); };
  $('#datum').onchange = (e) => datumSetzen(e.target.value);
  $('#zurueck').onclick = () => datumSetzen(tagPlus(T.datum, -1));
  $('#vor').onclick = () => datumSetzen(tagPlus(T.datum, 1));
  $('#heute').onclick = () => datumSetzen(isoTag(new Date()));
  $('#schicht').onchange = (e) => { T.schicht = e.target.value; zeichnen(); };
  $('#suche').oninput = (e) => { T.suche = e.target.value.toLowerCase(); zeichnen(); };
  document.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => { T.ansicht = b.dataset.a; zeichnen(); }; });
  $('#neu').onclick = () => neueReservierung();
  $('#walkin').onclick = () => walkIn();
  $('#warte').onclick = () => neueReservierung({ warteliste: true });
  $('#mehr').onchange = async (e) => {
    const w = e.target.value; e.target.value = '';
    try {
      if (w === 'demo') { melden('Richte Testdaten ein …'); const r = await rpc('testdaten.einrichten'); melden(`Eingerichtet: ${r.tische} Tische, ${r.buchungen} Buchungen${r.fehler.length ? ' · ' + r.fehler.join(', ') : ''}`); T.tische = []; laden(); }
      if (w === 'demoweg') { if (!confirm('Alle Testbuchungen und Testgäste löschen?')) return; const r = await rpc('testdaten.loeschen'); melden(`Gelöscht: ${r.buchungen} Buchungen`); laden(); }
      if (w === 'nachr') { const n = await rpc('team.nachruecken', T.datum); melden(n ? `${n} Angebot(e) an die Warteliste verschickt` : 'Kein passender Platz für die Warteliste frei'); laden(); }
      if (w === 'buchung') seiteOeffnen('/reservieren');
      if (w === 'team') teamVerwalten();
      if (w === 'sprache') spracheWechseln();
      if (w === 'abmelden') { if (confirm('Auf diesem Gerät abmelden?')) abmelden(); }
    } catch (f) { melden(f.message, true); }
  };
  laden();
  setInterval(() => { if (!document.querySelector('.modal')) laden(true); }, 30000);
}

async function laden(still = false) {
  try {
    const [buchungen, timeline, notiz, tische] = await Promise.all([
      rpc('reservierungen.tagesliste', T.datum),
      rpc('team.timeline', T.datum),
      rpc('team.tagesnotizLaden', T.datum),
      T.tische.length ? Promise.resolve(T.tische) : rpc('team.tischeLaden')
    ]);
    // tagesliste liefert 36 h ab Mitternacht UTC – auf den Ortstag beschränken
    T.buchungen = buchungen.filter((b) => isoTag(b.datumZeit) === T.datum);
    T.timeline = timeline; T.notiz = notiz.text; T.tische = tische;
    if (T.gewaehlt && !T.buchungen.find((b) => b._id === T.gewaehlt)) T.gewaehlt = null;
    zeichnen();
    if (T.gewaehlt) detailZeigen(T.gewaehlt, true);
  } catch (f) { if (!still) melden(f.message, true); }
}

function sichtbar() {
  return T.buchungen.filter((b) => {
    if (T.schicht !== 'alle' && b.schicht !== T.schicht) return false;
    const f = T.filter;
    if (f === 'offen' && b.status !== 'angefragt' && b.status !== 'zeitvorschlag') return false;
    if (f === 'kommend' && !['bestaetigt', 'rueckbestaetigt', 'angefragt'].includes(b.status)) return false;
    if (f === 'service' && !['wartet_drinnen', 'eingetroffen'].includes(b.status)) return false;
    if (f === 'warteliste' && b.status !== 'warteliste') return false;
    if (f === 'noshow' && b.status !== 'noShow' && !b.ueberfaellig) return false;
    if (f === 'storno' && !['storniert', 'spaet_storniert'].includes(b.status)) return false;
    if (f === 'alle' && ['storniert', 'spaet_storniert'].includes(b.status)) return false;
    if (T.suche) { const t = (gastName(b) + ' ' + (b.tische || []).join(' ') + ' ' + (b.gastId?.telefonE164 || '')).toLowerCase(); if (!t.includes(T.suche)) return false; }
    return true;
  });
}

function zeichnen() {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('an', b.dataset.a === T.ansicht));
  const aktiv = T.buchungen.filter((b) => !INAKTIV.includes(b.status));
  const pers = (s) => aktiv.filter((b) => b.schicht === s).reduce((a, b) => a + b.personen, 0);
  const z = (f) => T.buchungen.filter(f).length;
  const chips = [['alle', 'Alle'], ['offen', `Offen (${z((b) => b.status === 'angefragt' || b.status === 'zeitvorschlag')})`], ['kommend', 'Kommend'], ['service', `Im Service (${z((b) => ['wartet_drinnen', 'eingetroffen'].includes(b.status))})`], ['warteliste', `Warteliste (${z((b) => b.status === 'warteliste')})`], ['noshow', `No-Show (${z((b) => b.status === 'noShow' || b.ueberfaellig)})`], ['storno', 'Stornos']];
  $('#kennzahlen').innerHTML = `
    <span class="kennzahl">Mittag <b>${pers('mittag')}</b> Pers.</span><span class="kennzahl">Abend <b>${pers('abend')}</b> Pers.</span>
    <span class="kennzahl leise">${aktiv.length} Reservierungen</span>
    ${T.timeline?.konflikte?.length ? `<span class="badge s-noShow">${T.timeline.konflikte.length} Tischkonflikt(e)</span>` : ''}
    <span style="flex:1"></span>${chips.map(([k, t]) => `<span class="chip ${T.filter === k ? 'an' : ''}" data-f="${k}">${t}</span>`).join('')}`;
  document.querySelectorAll('[data-f]').forEach((c) => { c.onclick = () => { T.filter = c.dataset.f; zeichnen(); }; });
  if (T.ansicht === 'liste') listeZeichnen(); else if (T.ansicht === 'timeline') timelineZeichnen(); else planZeichnen();
  if (!T.gewaehlt) seiteStandard();
}

function hinweisSymbole(b) {
  const s = [];
  if (b.ueberfaellig) s.push('<span class="warnsymbol" title="Überfällig – No-Show prüfen">⏰</span>');
  if (b.rueckbestaetigungWarnung) s.push('<span title="Keine Rückbestätigung – bitte anrufen">📞</span>');
  if (b.tischGesperrt) s.push('<span title="Tisch fixiert">🔒</span>');
  if (b.gastId?.allergien) s.push(`<span title="Allergie: ${esc(b.gastId.allergien)}">⚠️</span>`);
  if (b.gastWunsch || b.notiz) s.push(`<span title="${esc([b.gastWunsch, b.notiz].filter(Boolean).join(' · '))}">💬</span>`);
  return s.join(' ');
}

function listeZeichnen() {
  const reihen = sichtbar().sort((a, b) => new Date(a.datumZeit) - new Date(b.datumZeit));
  if (!reihen.length) { $('#inhalt').innerHTML = `<div class="karte leise">Keine Reservierungen für diese Auswahl. ${T.buchungen.length ? '' : 'Tipp: oben rechts <b>⋯ → Testdaten einrichten</b>.'}</div>`; return; }
  $('#inhalt').innerHTML = `<table class="liste"><tr><th>Zeit</th><th>Gast</th><th>Pers.</th><th>Tisch</th><th>Status</th><th>Risiko</th><th></th></tr>
  ${reihen.map((b) => `<tr class="reihe ${T.gewaehlt === b._id ? 'gewaehlt' : ''}" data-id="${b._id}">
    <td class="zeit">${uhr(b.datumZeit)}</td>
    <td><div class="fett">${esc(gastName(b))}</div><div class="klein leise">${esc(STUFE_TEXT[b.gaststufe] || '')}${b.gastId?.anzahlBesuche ? ' · ' + b.gastId.anzahlBesuche + ' Besuche' : ''}${(b.tags || []).map((t) => ' · #' + esc(t)).join('')}${b.vermittler ? ' · via ' + esc(b.vermittler) : ''} · ${esc(b.quelle || '')}</div></td>
    <td class="fett">${b.personen}</td><td>${esc((b.tische || []).join('+') || '–')}</td>
    <td>${badge(b.status)}${b.status === 'zeitvorschlag' && b.angebotBis ? `<div class="klein leise">bis ${uhr(b.angebotBis)}</div>` : ''}</td>
    <td>${b.risiko ? `<span class="badge r-${b.risiko.stufe}" title="${esc(b.risiko.gruende.join(', '))}">${b.risiko.punkte}</span>` : ''}</td>
    <td>${hinweisSymbole(b)}</td></tr>`).join('')}</table>`;
  document.querySelectorAll('tr.reihe').forEach((r) => { r.onclick = () => detailZeigen(r.dataset.id); });
}

function timelineZeichnen() {
  const tl = T.timeline; if (!tl) return;
  const von = T.schicht === 'abend' ? 17 * 60 : 11 * 60, bis = T.schicht === 'mittag' ? 15 * 60 : 23 * 60 + 30;
  const pxMin = 2.2, breite = (bis - von) * pxMin + 70, x = (m) => 64 + (m - von) * pxMin;
  const filter = new Set(sichtbar().map((b) => b._id));
  let html = `<div class="tl" style="max-height:calc(100vh - 150px)"><div style="width:${breite}px;position:relative"><div class="tl-kopf">`;
  for (let h = Math.ceil(von / 60); h * 60 <= bis; h++) html += `<span class="tl-std" style="left:${x(h * 60) - 12}px">${h}:00</span>`;
  html += `</div>`;
  let gruppe = '';
  for (const z of tl.zeilen) {
    if (z.bereich !== gruppe) { gruppe = z.bereich; html += `<div class="tl-gruppe">${esc(gruppe === 'terrasse' ? 'Terrasse' : gruppe === 'innen' ? 'Innen' : gruppe)}</div>`; }
    html += `<div class="tl-zeile"><div class="tl-name">${esc(z.tisch)}<span class="leise" style="font-weight:400;margin-left:3px">${z.maxPersonen ? '·' + z.maxPersonen : ''}</span></div>`;
    for (const b of z.balken) {
      if (b.endeMin < von || b.startMin > bis || !filter.has(b.id)) continue;
      const l = x(Math.max(b.startMin, von)), w = Math.max(18, (Math.min(b.endeMin, bis) - Math.max(b.startMin, von)) * pxMin - 2);
      html += `<div class="tl-balken ${b.konflikt ? 'konflikt' : ''}" data-id="${b.id}" style="left:${l}px;width:${w}px;background:${BALKENFARBE[b.status] || '#e5e7eb'}" title="${esc(b.name)} · ${b.personen} P.">${b.gesperrt ? '🔒' : ''}<b>${b.personen}</b> ${esc(b.name)}${b.risiko >= 50 ? ' ⚠' : ''}</div>`;
    }
    html += `</div>`;
  }
  const jetzt = minuten(new Date());
  if (T.datum === isoTag(new Date()) && jetzt >= von && jetzt <= bis) html += `<div class="tl-jetzt" style="left:${x(jetzt)}px"></div>`;
  html += `</div></div>`;
  if (tl.ohneTisch.length) html += `<div class="karte" style="margin-top:10px"><b>Ohne Tisch:</b> ${tl.ohneTisch.map((b) => `<span class="chip" data-id="${b.id}">${b.personen} P. ${esc(b.name)}</span>`).join(' ')}</div>`;
  $('#inhalt').innerHTML = html;
  document.querySelectorAll('#inhalt [data-id]').forEach((e) => { e.onclick = () => detailZeigen(e.dataset.id); });
}

function planZeichnen() {
  if (T.planZeit === null) T.planZeit = T.datum === isoTag(new Date()) ? Math.max(11 * 60 + 30, Math.min(Math.floor(minuten(new Date()) / 15) * 15, 22 * 60)) : 19 * 60;
  const bereiche = [...new Set(T.tische.map((t) => t.bereich))];
  if (!T.planBereich) T.planBereich = bereiche.includes('innen') ? 'innen' : bereiche[0];
  const tische = T.tische.filter((t) => t.bereich === T.planBereich);
  const maxX = Math.max(...tische.map((t) => (t.positionX || 0) + (t.planBreite || 100)), 400);
  const maxY = Math.max(...tische.map((t) => (t.positionY || 0) + (t.planHoehe || 80)), 300);
  const faktor = Math.min(1, 900 / maxX);
  const belegung = (nr) => T.buchungen.find((b) => (b.tische || []).map((x) => String(x).toUpperCase()).includes(String(nr).toUpperCase()) && !INAKTIV.includes(b.status) && !['abgeschlossen', 'abgereist'].includes(b.status) && minuten(b.datumZeit) <= T.planZeit + 30 && minuten(b.datumZeit) + (b.dauerMinuten || 90) > T.planZeit);
  const hh = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  let html = `<div class="zeile" style="margin-bottom:10px">${bereiche.map((b) => `<span class="chip ${b === T.planBereich ? 'an' : ''}" data-bereich="${esc(b)}">${b === 'innen' ? 'Innen' : b === 'terrasse' ? 'Terrasse' : esc(b)}</span>`).join('')}
    <span style="margin-left:12px" class="fett">${hh(T.planZeit)}</span>
    <input type="range" id="planRegler" min="${11 * 60}" max="${23 * 60}" step="15" value="${T.planZeit}" style="width:260px">
    <span class="klein leise"><span class="badge" style="background:#dcfce7">am Tisch</span> <span class="badge" style="background:#dbeafe">reserviert</span> <span class="badge" style="background:#fef3c7">kommt in ≤30 min</span> · freien Tisch anklicken = reservieren</span></div>
    <div class="plan" style="height:${maxY * faktor + 30}px">`;
  for (const t of tische) {
    const b = belegung(t.nummer);
    const klasse = !t.aktiv ? 'inaktiv' : !b ? '' : ['eingetroffen', 'wartet_drinnen'].includes(b.status) ? 'da' : minuten(b.datumZeit) > T.planZeit ? 'bald' : 'belegt';
    html += `<div class="tisch ${t.form === 'rund' ? 'rund' : ''} ${klasse}" data-tisch="${esc(t.nummer)}" ${b ? `data-id="${b._id}"` : ''} style="left:${(t.positionX || 0) * faktor}px;top:${(t.positionY || 0) * faktor}px;width:${(t.planBreite || 100) * faktor}px;height:${(t.planHoehe || 80) * faktor}px;transform:rotate(${t.planDrehung || 0}deg)">
      <span class="nr">${esc(t.nummer)}</span><span class="leise">${t.minPersonen ? t.minPersonen + '–' + t.maxPersonen : ''}</span>${b ? `<span>${uhr(b.datumZeit)} · ${b.personen}P</span><span>${esc(gastName(b).split(' ')[0])}</span>` : ''}</div>`;
  }
  html += `</div>`;
  $('#inhalt').innerHTML = html;
  document.querySelectorAll('[data-bereich]').forEach((c) => { c.onclick = () => { T.planBereich = c.dataset.bereich; planZeichnen(); }; });
  $('#planRegler').oninput = (e) => { T.planZeit = +e.target.value; planZeichnen(); };
  document.querySelectorAll('.tisch').forEach((e) => { e.onclick = () => (e.dataset.id ? detailZeigen(e.dataset.id) : neueReservierung({ tisch: e.dataset.tisch, uhrzeit: T.planZeit })); });
}

const kurz = (b) => `<div class="karte" style="padding:8px 10px;margin-bottom:6px;cursor:pointer" data-id="${b._id}"><b>${uhr(b.datumZeit)}</b> · ${b.personen} P. · ${esc(gastName(b))} ${badge(b.status)}</div>`;

function seiteStandard() {
  const anfragen = T.buchungen.filter((b) => b.status === 'angefragt');
  const warte = T.buchungen.filter((b) => b.status === 'warteliste' || (b.status === 'zeitvorschlag' && b.angebotArt === 'warteliste'));
  const ueber = T.buchungen.filter((b) => b.ueberfaellig);
  $('#seite').innerHTML = `
    <h3 style="margin:0 0 8px">${datumText(T.datum + 'T12:00:00Z')}</h3>
    <label>Tagesnotiz fürs Team</label>
    <textarea id="notiz" rows="3" placeholder="z. B. Küche: keine Ente heute · Gruppe Müller VIP">${esc(T.notiz)}</textarea>
    <div class="zeile" style="justify-content:flex-end;margin-top:6px"><button class="klein" id="notizSpeichern">Speichern</button></div>
    <label>Online-Buchung</label>
    <div class="zeile"><button class="klein" data-aus="mittag">Mittag voll</button><button class="klein" data-aus="abend">Abend voll</button><button class="klein" data-aus="">Ganzer Tag voll</button><button class="klein" id="wiederAuf">Wieder öffnen</button></div>
    <p class="klein leise">„Voll" sperrt nur das Widget. Das Team kann weiter buchen.</p>
    ${ueber.length ? `<h4>⏰ Überfällig</h4>${ueber.map(kurz).join('')}` : ''}
    ${anfragen.length ? `<h4>Offene Anfragen</h4>${anfragen.map(kurz).join('')}` : ''}
    ${warte.length ? `<h4>Warteliste</h4>${warte.map(kurz).join('')}` : ''}
    <p class="klein leise" style="margin-top:20px">Klick auf eine Reservierung öffnet Details, Statusknöpfe und Verlauf.</p>`;
  $('#notizSpeichern').onclick = () => sicher(() => rpc('team.tagesnotizSpeichern', T.datum, $('#notiz').value), 'Notiz gespeichert');
  document.querySelectorAll('[data-aus]').forEach((b) => { b.onclick = () => sicher(() => rpc('team.ausgebuchtSchalten', T.datum, b.dataset.aus || null, true), 'Online gesperrt'); });
  $('#wiederAuf').onclick = () => sicher(async () => { for (const s of ['mittag', 'abend', null]) await rpc('team.ausgebuchtSchalten', T.datum, s, false); }, 'Online wieder offen');
  document.querySelectorAll('#seite [data-id]').forEach((e) => { e.onclick = () => detailZeigen(e.dataset.id); });
}

const verlaufHtml = () => (T.verlauf.length ? T.verlauf.map((v) => `<div style="padding:5px 0;border-bottom:1px solid var(--linie)"><span class="leise">${datumText(v.zeitpunkt)} ${uhr(v.zeitpunkt)}</span> · ${esc(v.text)} <span class="leise">(${esc(v.akteur === 'gast' ? 'Gast' : v.akteur === 'system' ? 'System' : 'Team')})</span></div>`).join('') : '<span class="leise">Noch keine Einträge.</span>');

async function detailZeigen(id, stillesNeuladen = false) {
  const b = T.buchungen.find((x) => x._id === id); if (!b) return;
  const neu = T.gewaehlt !== id; T.gewaehlt = id;
  if (!stillesNeuladen && T.ansicht === 'liste') listeZeichnen();
  if (neu) T.verlauf = [];
  const g = b.gastId && typeof b.gastId === 'object' ? b.gastId : {};

    m.querySelectorAll('[data-i]').forEach((k) => { k.onclick = () => { m.querySelectorAll('[data-i]').forEach((x) => x.classList.remove('an')); k.classList.add('an'); slot = slots[+k.dataset.i]; $('#nOk', m).disabled = false; }; });
    if (vorgabe.uhrzeit) { const k = [...m.querySelectorAll('[data-i]')].find((x) => minuten(slots[+x.dataset.i].zeit) >= vorgabe.uhrzeit); if (k) k.click(); }
    const w = $('#nZurWarte', m); if (w) w.onclick = (e) => { e.preventDefault(); m.remove(); neueReservierung({ warteliste: true }); };
  };
  $('#nDat', m).onchange = slotsLaden; $('#nPers', m).onchange = slotsLaden; slotsLaden();
  let suchT;
  const suchen = (feld) => { clearTimeout(suchT); suchT = setTimeout(async () => {
    const wert = feld.value; if (wert.length < 3) { $('#nTreffer', m).innerHTML = ''; return; }
    const tr = await rpc('team.gastSuchen', wert).catch(() => []);

  }, 300); };
  $('#nTel', m).oninput = (e) => suchen(e.target); $('#nNach', m).oninput = (e) => suchen(e.target);
  $('#nAbbr', m).onclick = () => m.remove();
  $('#nOk', m).onclick = async () => {
    const basis = { personen: +$('#nPers', m).value, telefon: $('#nTel', m).value, vorname: $('#nVor', m).value, nachname: $('#nNach', m).value, email: $('#nMail', m).value };
    const tag = $('#nDat', m).value;
    try {
      if (istWarte) {
        const [h, mi] = $('#nWunsch', m).value.split(':').map(Number);
        await sicher(() => rpc('team.aufWarteliste', { ...basis, zeit: zeitAm(tag, h * 60 + mi) }), 'Auf der Warteliste');
      } else {
        await sicher(() => rpc('reservierungen.anlegen', { ...basis, zeit: slot.zeit, tische: slot.tische, quelle: $('#nQuelle', m).value, tags: $('#nTags', m).value.split(',').map((s) => s.trim()).filter(Boolean), notiz: $('#nNotiz', m).value }), 'Reserviert');
      }
      m.remove(); T.datum = tag; $('#datum').value = tag; laden();
    } catch (f) { /* Meldung steht schon */ }
  };
}

      melden(`Walk-in an Tisch ${s.tische.join('+')}`); m.remove(); T.datum = tag; $('#datum').value = tag; laden();
    } catch (f) { melden(f.message, true); }
  };
}

const B = { personen: 2, datum: null, tage: [], slots: [], slot: null, hinweis: '', warteliste: false, zurWarte: false };
function buchungStart() { document.body.insertAdjacentHTML('beforeend', spracheKnopf().replace('sprachwahl', 'sprachwahl schwebend')); B.datum = isoTag(new Date()); buchungZeichnen(); tageLaden(); }

async function tageLaden() {
  B.hinweis = 'lädt …'; buchungZeichnen();
  try { B.tage = await rpc('verfuegbarkeit.kalenderUebersicht', isoTag(new Date()), 14, B.personen); } catch (f) { B.tage = []; }
  const erster = B.tage.find((t) => t.frei);
  if (erster && !B.tage.find((t) => t.datum === B.datum && t.frei)) B.datum = erster.datum;
  slotsLaden();
}
async function slotsLaden() {
  B.slot = null; B.slots = []; B.hinweis = 'lädt …'; buchungZeichnen();
  try {
    const r = await rpc('verfuegbarkeit.freieZeiten', B.datum, B.personen);
    B.slots = r.slots; B.hinweis = r.hinweis || ''; B.warteliste = r.wartelisteMoeglich;
  } catch (f) { B.hinweis = f.message; }
  buchungZeichnen();
}
function buchungZeichnen() {
  const nachSchicht = (s) => B.slots.filter((x) => x.schicht === s);
  const wt = (iso) => new Intl.DateTimeFormat(LOC, { weekday: 'short', timeZone: TZ }).format(new Date(iso + 'T12:00:00Z'));

  $('#wurzel').innerHTML = `<div class="gast">
    <div class="leise">Restaurant Sichuan · Wien</div><h1>Tisch reservieren</h1>
    <h2>Wie viele Personen?</h2>
    <div class="raster">${[1, 2, 3, 4, 5, 6, 7, 8].map((n) => `<button data-p="${n}" class="${n === B.personen ? 'an' : ''}">${n}</button>`).join('')}</div>

    <h2>Uhrzeit</h2>
    ${['mittag', 'abend'].map((s) => (nachSchicht(s).length ? `<div class="leise klein" style="margin:6px 0">${s === 'mittag' ? 'Mittag' : 'Abend'}</div><div class="raster">${nachSchicht(s).map((x) => `<button data-z="${x.zeit}" class="${B.slot === x.zeit ? 'an' : ''}">${uhr(x.zeit)}</button>`).join('')}</div>` : '')).join('')}
    ${!B.slots.length ? `<div class="karte"><div>${esc(B.hinweis)}</div>${B.warteliste ? `<button class="primaer" id="zurWarte" style="margin-top:10px">Auf die Warteliste setzen</button><p class="klein leise">Wird ein Tisch frei, bekommen Sie ihn per SMS angeboten – reserviert nur für Sie.</p>` : ''}</div>` : ''}
    <div id="formular" class="${B.slot || B.zurWarte ? '' : 'versteckt'}">
      <h2>${B.zurWarte ? 'Warteliste – Ihre Daten' : 'Ihre Daten'}</h2>
      ${B.zurWarte ? `<label>Ungefähre Wunschzeit</label><input type="time" id="fWunsch" value="19:30" step="900">` : ''}
      <div class="zeile" style="flex-wrap:nowrap"><div style="flex:1"><label>Vorname *</label><input id="fVor"></div><div style="flex:1"><label>Nachname *</label><input id="fNach"></div></div>
      <label>Mobilnummer *</label><input id="fTel" type="tel" placeholder="0664 1234567"><label>E-Mail</label><input id="fMail" type="email">
      ${B.zurWarte ? '' : `<label>Wünsche (Allergien, Anlass …)</label><textarea id="fWunschText" rows="2"></textarea>`}
      <button class="primaer" id="fOk" style="width:100%;margin-top:14px;padding:12px">${B.zurWarte ? 'Auf die Warteliste' : `Reservieren · ${B.slot ? datumText(B.slot) + ', ' + uhr(B.slot) : ''} · ${B.personen} Pers.`}</button>
    </div>
    <div class="marke">Eigenes Reservierungssystem · Test</div></div>`;
  document.querySelectorAll('[data-p]').forEach((k) => { k.onclick = () => { B.personen = +k.dataset.p; B.zurWarte = false; tageLaden(); }; });
  document.querySelectorAll('[data-d]').forEach((k) => { k.onclick = () => { B.datum = k.dataset.d; B.zurWarte = false; slotsLaden(); }; });
  document.querySelectorAll('[data-z]').forEach((k) => { k.onclick = () => { B.slot = k.dataset.z; B.zurWarte = false; buchungZeichnen(); $('#formular').scrollIntoView({ behavior: 'smooth' }); }; });

const G = { stand: null, aendern: false, nurWeniger: false, wahl: null };
async function gastStart() {
  document.body.insertAdjacentHTML('beforeend', spracheKnopf().replace('sprachwahl', 'sprachwahl schwebend'));
  if (!INIT.token) { $('#wurzel').innerHTML = `<div class="gast"><h1>Link unvollständig</h1><p>Bitte öffnen Sie den Link aus Ihrer SMS oder E-Mail.</p></div>`; return; }
  try { G.stand = await rpc('gastverwaltung.laden', INIT.token); } catch (f) { $('#wurzel').innerHTML = `<div class="gast"><h1>Link ungültig</h1><p>${esc(f.message)}</p></div>`; return; }
  if (INIT.absicht === 'rueckbestaetigen' && G.stand.darfRueckbestaetigen) { await gastAktion('rueckbestaetigen', 'Danke! Wir haben Ihren Tisch fest eingeplant.'); return; }
  gastZeichnen();
}
async function gastAktion(methode, meldung, ...args) {
  try { G.stand = await rpc('gastverwaltung.' + methode, INIT.token, ...args); G.aendern = false; gastZeichnen(); melden(meldung); } catch (f) { melden(f.message, true); }
}
function gastZeichnen() {
  const s = G.stand;
  $('#wurzel').innerHTML = `<div class="gast"><div class="leise">Restaurant Sichuan</div><h1>${s.vorname ? 'Hallo ' + esc(s.vorname) : 'Ihre Reservierung'}</h1>
    <div class="karte"><div class="fett" style="font-size:18px">${datumText(s.zeit)} · ${uhr(s.zeit)} Uhr</div><div>${s.personen} ${s.personen === 1 ? 'Person' : 'Personen'}</div><div style="margin-top:6px">${badge(s.status)}</div>
    ${s.angebotOffen ? `<p><b>Für Sie reserviert bis ${uhr(s.angebotBis)} Uhr.</b></p><div class="zeile"><button class="primaer" id="annehmen">Annehmen</button><button id="ablehnen">Nein danke</button></div>` : ''}</div>
    ${s.darfRueckbestaetigen ? `<button class="primaer" id="rueck" style="width:100%;margin-top:14px;padding:12px">Ich komme ✓</button>` : ''}
    ${s.stornoGiltAlsSpaet && s.darfStornieren && s.status !== 'warteliste' ? `<div class="karte" style="margin-top:14px;background:#fffbeb"><b>Ihr Termin ist in weniger als ${s.stornofristStunden} Stunden.</b><br>Eine Absage jetzt lässt den Tisch meist leer. Kommen Sie mit weniger Personen? Dann passen Sie lieber die Anzahl an.${s.personen > 1 ? `<div style="margin-top:8px"><button id="weniger">Personenzahl verringern</button></div>` : ''}</div>` : ''}
    <div class="zeile" style="margin-top:14px">${s.darfAendern ? `<button id="aendern">Ändern</button>` : ''}${s.darfStornieren ? `<button id="storno">${s.status === 'warteliste' ? 'Von der Warteliste nehmen' : 'Stornieren'}</button>` : ''}</div>
    <div id="aendernBox" class="${G.aendern ? '' : 'versteckt'}">
      <h2>${G.nurWeniger ? 'Personenzahl' : 'Reservierung ändern'}</h2>
      <div class="zeile" style="flex-wrap:nowrap">${G.nurWeniger ? '' : `<div style="flex:1"><label>Datum</label><input type="date" id="aDat" value="${isoTag(s.zeit)}"></div>`}<div style="width:100px"><label>Personen</label><input type="number" id="aPers" min="1" max="${G.nurWeniger ? s.personen : 8}" value="${G.nurWeniger ? Math.max(1, s.personen - 1) : s.personen}"></div></div>
      ${G.nurWeniger ? '' : `<label>Uhrzeit</label><div class="raster" id="aSlots"></div>`}
      <label>Wünsche</label><textarea id="aWunsch" rows="2">${esc(s.gastWunsch)}</textarea>
      <button class="primaer" id="aOk" style="width:100%;margin-top:12px">Speichern</button>
    </div>
    <div class="marke">Eigenes Reservierungssystem · Test</div></div>`;
  const an = (id, fn) => { const e = $('#' + id); if (e) e.onclick = fn; };
  an('annehmen', () => gastAktion('angebotAnnehmen', 'Wunderbar – Ihr Tisch ist bestätigt.'));
  an('ablehnen', () => gastAktion('angebotAblehnen', 'Schade. Wir geben den Tisch weiter.'));
  an('rueck', () => gastAktion('rueckbestaetigen', 'Danke! Wir freuen uns auf Sie.'));
  an('storno', () => { if (confirm(s.stornoGiltAlsSpaet ? 'Die Frist ist abgelaufen – die Absage zählt als spät. Trotzdem stornieren?' : 'Reservierung wirklich stornieren?')) gastAktion('stornieren', 'Storniert.'); });
  an('aendern', () => { G.aendern = true; G.nurWeniger = false; gastZeichnen(); gastSlots(); });
  an('weniger', () => { G.aendern = true; G.nurWeniger = true; gastZeichnen(); });
  an('aOk', () => {
    const aend = { personen: +$('#aPers').value, gastWunsch: $('#aWunsch').value };
    if (!G.nurWeniger && G.wahl && G.wahl !== s.zeit) aend.zeit = G.wahl;
    gastAktion('aendern', 'Gespeichert – Sie bekommen eine neue Bestätigung.', aend);
  });
  const d = $('#aDat'); if (d) d.onchange = gastSlots;
  const p = $('#aPers'); if (p && !G.nurWeniger) p.onchange = gastSlots;
}
async function gastSlots() {
  const s = G.stand; G.wahl = s.zeit;
  const tag = $('#aDat').value, pers = +$('#aPers').value;
  $('#aSlots').innerHTML = '<span class="leise">lädt …</span>';
  const r = await rpc('verfuegbarkeit.freieZeiten', tag, pers);
  const liste = (isoTag(s.zeit) === tag ? [{ zeit: s.zeit, bisher: true }] : []).concat(r.slots.filter((x) => x.zeit !== s.zeit));
  liste.sort((a, b) => new Date(a.zeit) - new Date(b.zeit));
  $('#aSlots').innerHTML = liste.map((x) => `<button data-z="${x.zeit}" class="${x.zeit === G.wahl ? 'an' : ''}">${uhr(x.zeit)}${x.bisher ? '*' : ''}</button>`).join('') || `<span class="leise">${esc(r.hinweis || 'nichts frei')}</span>`;
  document.querySelectorAll('#aSlots [data-z]').forEach((k) => { k.onclick = () => { G.wahl = k.dataset.z; document.querySelectorAll('#aSlots [data-z]').forEach((x) => x.classList.toggle('an', x === k)); }; });
}
</script>
</body>
</html>
