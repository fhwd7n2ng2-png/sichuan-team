    const w = (id) => $(id, m).value.replace(',', '.');
    const r = await sicher(() => rpc('zahlung.einstellungenSpeichern', {
      gutscheine: { aktiv: $('#zeG', m).checked, betraege: $('#zeGB', m).value, gueltigJahre: $('#zeGJ', m).value, freiMin: $('#zeGmin', m).value, freiMax: $('#zeGmax', m).value },
      events: { aktiv: $('#zeE', m).checked },
      anzahlung: { aktiv: $('#zeA', m).checked, abPersonen: $('#zeAP', m).value, proPerson: w('#zeAB'), erstattenBeiStorno: $('#zeAS', m).checked },
      garantie: { aktiv: $('#zeK', m).checked, abPersonen: $('#zeKP', m).value, proPerson: w('#zeKB') },
      sondertage: tage.map((t) => ({ ...t, proPerson: String(t.proPerson).replace(',', '.') }))
    }), 'Gespeichert');
    if (r) { m.remove(); gutscheineLaden(); }
  };
}

/* --------------------------- Gast: Gutschein --------------------------- */
async function gutscheinGastStart() {
  $('#wurzel').innerHTML = '<div class="gast leise">Lädt …</div>';
  if (INIT.gutschein) {
    try { gutscheinGastZeichnen(await rpc('zahlung.gutscheinAnsehen', INIT.gutschein, INIT.sitzung || '')); }
    catch (f) { $('#wurzel').innerHTML = `<div class="gast"><h1>${L3({ de: 'Link ungültig', en: 'Invalid link', zh: '链接无效' })}</h1><p>${esc(f.message)}</p></div>`; }
    return;
  }
  try { ZO = await rpc('zahlung.einstellungenOeffentlich'); } catch (f) { ZO = null; }
  gutscheinKaufZeichnen();
}
const GK = { betrag: null };
function gutscheinKaufZeichnen() {
  const g = ZO?.gutscheine;
  if (!g) { $('#wurzel').innerHTML = `<div class="gast"><div class="leise">Restaurant Sichuan · Wien</div><h1>${L3({ de: 'Gutscheine', en: 'Gift vouchers', zh: '礼券' })}</h1><div class="karte">${L3({ de: 'Gutscheine bekommen Sie gerne direkt bei uns im Restaurant.', en: 'Gift vouchers are available directly at our restaurant.', zh: '礼券可直接在餐厅购买。' })}</div></div>`; return; }
  if (GK.betrag == null) GK.betrag = g.betraege[1] ?? g.betraege[0] ?? g.freiMin;
  $('#wurzel').innerHTML = `<div class="gast"><div class="leise">Restaurant Sichuan · Wien</div><h1>${L3({ de: 'Gutschein verschenken', en: 'Give a gift voucher', zh: '赠送礼券' })}</h1>
    <h2>${L3({ de: 'Betrag', en: 'Amount', zh: '金额' })}</h2>
    <div class="raster">${g.betraege.map((b) => `<button data-gb="${b}" class="${GK.betrag === b ? 'an' : ''}">${euro(b)}</button>`).join('')}</div>
    <label>${L3({ de: `Anderer Betrag (${g.freiMin}–${g.freiMax} €)`, en: `Other amount (€${g.freiMin}–${g.freiMax})`, zh: `其他金额（${g.freiMin}–${g.freiMax} 欧元）` })}</label><input id="gkFrei" type="number" min="${g.freiMin}" max="${g.freiMax}" value="${g.betraege.includes(GK.betrag) ? '' : GK.betrag}">
    <h2>${L3({ de: 'Für wen?', en: 'For whom?', zh: '赠送给谁？' })}</h2>
    <label>${L3({ de: 'Name der/des Beschenkten (erscheint auf dem Gutschein)', en: 'Recipient name (shown on the voucher)', zh: '受赠人姓名（显示在礼券上）' })}</label><input id="gkE">
    <label>${L3({ de: 'Persönliche Nachricht', en: 'Personal message', zh: '祝福语' })}</label><textarea id="gkN" rows="2" maxlength="300"></textarea>
    <h2>${L3({ de: 'Ihre Daten', en: 'Your details', zh: '您的信息' })}</h2>
    <label>${L3({ de: 'Ihr Name *', en: 'Your name *', zh: '您的姓名 *' })}</label><input id="gkK"><label>${L3({ de: 'E-Mail * (dorthin schicken wir den Gutschein)', en: 'Email * (we send the voucher there)', zh: '电子邮箱 *（礼券将发送至此）' })}</label><input id="gkM" type="email">
    <p class="klein leise">${L3({ de: `Gültig ${g.gueltigJahre} Jahre ab Kauf, auch in Teilbeträgen einlösbar. Sie bekommen den Gutschein per E-Mail und können ihn ausdrucken oder weiterleiten.`, en: `Valid for ${g.gueltigJahre} years from purchase, redeemable in parts. You receive the voucher by email and can print or forward it.`, zh: `自购买起 ${g.gueltigJahre} 年内有效，可分次使用。礼券将通过电子邮件发送，可打印或转发。` })}</p>
    <button class="primaer" id="gkOk" style="width:100%;margin-top:10px;padding:12px">${L3({ de: 'Weiter zur Zahlung', en: 'Continue to payment', zh: '去付款' })} · ${euro(GK.betrag)}</button>
    <p class="klein leise" style="text-align:center">${L3({ de: 'Sichere Zahlung über Stripe', en: 'Secure payment via Stripe', zh: '通过 Stripe 安全支付' })}</p>
    <p><a href="#" id="gkKarte">→ ${L3({ de: 'Speisekarte', en: 'Menu', zh: '菜单' })}</a></p></div>`;
  const merken = () => ({ e: $('#gkE').value, n: $('#gkN').value, k: $('#gkK').value, m: $('#gkM').value });
  const setzen = (w) => { $('#gkE').value = w.e; $('#gkN').value = w.n; $('#gkK').value = w.k; $('#gkM').value = w.m; };
  document.querySelectorAll('[data-gb]').forEach((b) => { b.onclick = () => { const w = merken(); GK.betrag = +b.dataset.gb; gutscheinKaufZeichnen(); setzen(w); }; });
  $('#gkFrei').onchange = (ev) => { const v = Math.round(+ev.target.value); if (v) { const w = merken(); GK.betrag = v; gutscheinKaufZeichnen(); setzen(w); } };
  $('#gkKarte').onclick = (ev) => { ev.preventDefault(); if (KG.karte) karteGastZeichnen(); else seiteOeffnen('/karte'); };
  $('#gkOk').onclick = async (ev) => {
    ev.target.disabled = true;
    try { const r = await rpc('zahlung.gutscheinKaufen', { betrag: GK.betrag, empfaengerName: $('#gkE').value, nachricht: $('#gkN').value, kaeuferName: $('#gkK').value, kaeuferEmail: $('#gkM').value, sprache: SPRACHE }); urlOeffnen(r.url); }
    catch (f) { melden(f.message, true); ev.target.disabled = false; }
  };
}
function gutscheinHtml(g) {
  const bis = g.gueltigBis ? new Intl.DateTimeFormat(LOC, { timeZone: TZ, dateStyle: 'long' }).format(new Date(g.gueltigBis)) : '';
  return `<div class="gutschein">
    <div class="gs-kopf">四川 · RESTAURANT SICHUAN</div>
    <div class="gs-titel">${L3({ de: 'Gutschein', en: 'Gift Voucher', zh: '礼券' })}</div>
    <div class="gs-wert">${euroC(g.betragCent)}</div>
    ${g.empfaengerName ? `<div class="gs-fuer">${L3({ de: 'für', en: 'for', zh: '赠予' })} <b>${esc(g.empfaengerName)}</b></div>` : ''}
    ${g.nachricht ? `<div class="gs-nachricht">„${esc(g.nachricht)}“${g.kaeuferName ? `<div class="klein">— ${esc(g.kaeuferName)}</div>` : ''}</div>` : ''}
    <div class="gs-code">${esc(g.code)}</div>
    <div class="gs-fuss">${bis ? `${L3({ de: 'Gültig bis', en: 'Valid until', zh: '有效期至' })} ${bis} · ` : ''}${L3({ de: 'Bitte bei der Reservierung erwähnen.', en: 'Please mention it when booking.', zh: '预订时请告知。' })}<br>Restaurant Sichuan · Wien · 01 263 37 13 · thesichuan.com</div>
  </div>`;
}
function gutscheinGastZeichnen(g) {
  if (g.zustand === 'offen') {
    $('#wurzel').innerHTML = `<div class="gast"><h1>${L3({ de: 'Zahlung wird geprüft …', en: 'Checking payment …', zh: '正在确认付款 …' })}</h1><div class="karte">${L3({ de: 'Sobald die Zahlung bestätigt ist, erscheint hier Ihr Gutschein und Sie bekommen ihn per E-Mail.', en: 'As soon as the payment is confirmed, your voucher appears here and is sent by email.', zh: '付款确认后，礼券将显示在此并通过邮件发送。' })}</div><button class="primaer" id="gNeu" style="margin-top:12px">${L3({ de: 'Neu laden', en: 'Reload', zh: '刷新' })}</button></div>`;
    $('#gNeu').onclick = () => setTimeout(gutscheinGastStart, 300);
    return;
  }
  const hinweis = g.zustand === 'aktiv' ? (g.restCent < g.betragCent ? `${L3({ de: 'Restwert', en: 'Remaining value', zh: '余额' })}: <b>${euroC(g.restCent)}</b>` : '')
    : L3({ de: { eingeloest: 'Dieser Gutschein ist vollständig eingelöst.', abgelaufen: 'Dieser Gutschein ist abgelaufen.', storniert: 'Dieser Gutschein wurde storniert.' }[g.zustand] || '', en: { eingeloest: 'This voucher has been fully redeemed.', abgelaufen: 'This voucher has expired.', storniert: 'This voucher was cancelled.' }[g.zustand] || '', zh: { eingeloest: '此礼券已全部使用。', abgelaufen: '此礼券已过期。', storniert: '此礼券已作废。' }[g.zustand] || '' });
  $('#wurzel').innerHTML = `<div class="gast">${INIT.sitzung ? `<div class="karte" style="background:#f0fdf4">✓ ${L3({ de: 'Danke! Der Gutschein ist bezahlt und unterwegs in Ihr Postfach.', en: 'Thank you! The voucher is paid and on its way to your inbox.', zh: '谢谢！礼券已付款并已发送至您的邮箱。' })}</div>` : ''}
    ${gutscheinHtml(g)}${hinweis ? `<p class="klein" style="text-align:center">${hinweis}</p>` : ''}
    <div class="zeile" style="justify-content:center;margin-top:12px"><button class="primaer" id="gDruck">${L3({ de: 'Drucken / als PDF speichern', en: 'Print / save as PDF', zh: '打印 / 保存为 PDF' })}</button></div></div>`;
  $('#gDruck').onclick = () => {
    let d = document.getElementById('druck');
    if (!d) { d = document.createElement('div'); d.id = 'druck'; document.body.appendChild(d); }
    d.innerHTML = gutscheinHtml(g); window.print();
  };
}
</script>
